<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Advanced Vocabulary — คำศัพท์เตรียมสอบ IELTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC;
    --paper-line:#E4DFD2;
    --ink:#2B2822;
    --ink-soft:#6B6558;
    --card-bg:#FFFDF8;
    --shadow:rgba(43,40,34,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans Thai','Inter',sans-serif;
    background:
      repeating-linear-gradient(180deg, transparent, transparent 35px, var(--paper-line) 36px),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  /* Header */
  header{margin-bottom:22px;}
  .title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(26px,5vw,34px);
    margin:0;
    letter-spacing:-0.01em;
  }
  .set-badge{
    font-size:11.5px;font-weight:700;color:#fff;background:var(--ink);
    padding:4px 10px;border-radius:20px;letter-spacing:.02em;
    transform:translateY(-2px);
  }
  .title-th{font-family:'Noto Serif Thai',serif;font-size:16px;color:var(--ink-soft);margin:4px 0 0;}
  .meta-line{font-size:13px;color:var(--ink-soft);margin-top:10px;}

  /* Search */
  .search-box{margin:18px 0 14px;position:relative;}
  .search-box input{
    width:100%;
    padding:11px 14px 11px 38px;
    border-radius:10px;
    border:1.5px solid var(--paper-line);
    background:var(--card-bg);
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  .search-box input:focus{border-color:var(--ink-soft);}
  .search-box::before{
    content:"🔍";
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    font-size:14px;opacity:.55;
  }

  /* Category tabs styled like binder index tabs */
  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:20px;
    scrollbar-width:thin;
  }
  .tab{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:8px 8px 0 0;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    border:none;
    color:#fff;
    opacity:.55;
    transition:opacity .15s ease, transform .12s ease;
    white-space:nowrap;
  }
  .tab:hover{opacity:.8;}
  .tab.active{opacity:1;transform:translateY(-2px);}

  /* Flashcard */
  .card-stage{
    perspective:1400px;
    margin-bottom:16px;
  }
  .card{
    position:relative;
    width:100%;
    min-height:340px;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    border-radius:16px;
    background:var(--card-bg);
    box-shadow:0 10px 30px var(--shadow), 0 1px 0 rgba(255,255,255,.6) inset;
    border-left:7px solid var(--accent, #6A4C93);
    padding:30px 28px;
    display:flex;
    flex-direction:column;
  }
  .face-back{transform:rotateY(180deg);overflow-y:auto;}

  .cat-chip{
    align-self:flex-start;
    font-size:11.5px;
    font-weight:700;
    color:var(--accent, #6A4C93);
    background:var(--accent-light, #EFE7F5);
    padding:3px 10px;
    border-radius:20px;
    margin-bottom:16px;
    letter-spacing:.02em;
  }
  .word-front{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(32px,7vw,44px);
    line-height:1.1;
    margin:0 0 8px;
  }
  .pos{font-size:14px;color:var(--ink-soft);font-style:italic;margin-bottom:auto;}
  .flip-hint{
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed var(--paper-line);
  }

  .word-back{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin:0 0 4px;
  }
  .en-def{
    font-size:14px;
    color:var(--ink);
    margin:0 0 10px;
    line-height:1.6;
    padding-left:1px;
  }
  .en-def-label{
    font-size:10.5px;font-weight:700;letter-spacing:.04em;
    color:var(--accent,#6A4C93);margin-right:6px;
  }
  .th-meaning{
    font-family:'Noto Serif Thai',serif;
    font-size:16px;
    color:var(--ink);
    margin:0 0 14px;
    line-height:1.55;
  }
  .th-meaning-label{
    font-size:10.5px;font-weight:700;letter-spacing:.04em;
    font-family:'Noto Sans Thai',sans-serif;
    color:var(--accent,#6A4C93);margin-right:6px;
  }
  .usage{
    font-size:13.5px;
    color:var(--ink-soft);
    background:var(--paper);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:16px;
    line-height:1.6;
  }
  .usage b{color:var(--ink);}
  .ex-label{font-size:12px;font-weight:700;color:var(--accent,#6A4C93);letter-spacing:.03em;margin-bottom:8px;}
  .ex-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .ex-list li{
    font-size:14px;
    line-height:1.55;
    padding-left:22px;
    position:relative;
  }
  .ex-list li::before{
    content:attr(data-n);
    position:absolute;left:0;top:1px;
    font-size:11px;font-weight:700;
    color:#fff;background:var(--accent,#6A4C93);
    width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .ex-list mark{
    background:var(--accent-light,#EFE7F5);
    color:var(--accent,#6A4C93);
    padding:0 3px;
    border-radius:3px;
    font-weight:600;
  }

  /* Controls */
  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:18px;
  }
  .nav-btn{
    background:var(--card-bg);
    border:1.5px solid var(--paper-line);
    border-radius:10px;
    width:44px;height:44px;
    font-size:18px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease;
    flex:0 0 auto;
  }
  .nav-btn:hover{background:var(--paper);}
  .nav-btn:disabled{opacity:.35;cursor:default;}
  .counter{
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    flex:1;
  }
  .counter b{color:var(--ink);}
  .shuffle-btn{
    background:var(--card-bg);
    border:1.5px solid var(--paper-line);
    border-radius:10px;
    padding:0 16px;height:44px;
    font-size:13px;font-weight:600;
    font-family:inherit;
    cursor:pointer;
    color:var(--ink);
    display:flex;align-items:center;gap:6px;
    flex:0 0 auto;
  }
  .shuffle-btn:hover{background:var(--paper);}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:14px;
  }

  @media (max-width:480px){
    .face{padding:24px 20px;}
    .controls{flex-wrap:wrap;}
    .counter{order:3;width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-row">
      <h1>IELTS Advanced Vocabulary</h1>
      <span class="set-badge">ชุดที่ 5</span>
    </div>
    <p class="title-th">คำศัพท์ขั้นสูง 150 คำ แบ่งตามหัวข้อ พร้อมคำจำกัดความภาษาอังกฤษ ความหมายไทย วิธีใช้ และตัวอย่างประโยค 3 ระดับ</p>
    <p class="meta-line" id="metaLine"></p>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="ค้นหาคำศัพท์ หรือ พิมพ์คำแปลไทย...">
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="card-stage">
    <div class="card" id="card">
      <div class="face face-front" id="faceFront"></div>
      <div class="face face-back" id="faceBack"></div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" title="คำก่อนหน้า">←</button>
    <div class="counter" id="counter"></div>
    <button class="nav-btn" id="nextBtn" title="คำถัดไป">→</button>
  </div>
  <div class="controls" style="margin-top:10px;justify-content:center;">
    <button class="shuffle-btn" id="shuffleBtn">🔀 สุ่มลำดับ</button>
  </div>
</div>

<script>
const categories = [
  {id:'philosophy', name:'ปรัชญา-จริยธรรม', color:'#4A4A6E', light:'#E4E3EC'},
  {id:'disaster', name:'ภัยพิบัติ-การจัดการฉุกเฉิน', color:'#B23A3A', light:'#F5DEDE'},
  {id:'consumer', name:'พฤติกรรมผู้บริโภค-ค้าปลีก', color:'#C77F2E', light:'#F5E6D3'},
  {id:'military', name:'การทหาร-ความมั่นคง', color:'#4B5320', light:'#E2E5D6'},
  {id:'weather', name:'สภาพอากาศ-ภูมิอากาศ', color:'#3D7EA6', light:'#DCEAF3'},
  {id:'physiology', name:'ร่างกาย-สรีรวิทยา', color:'#A13F5C', light:'#F1DEE4'},
];

const vocab = [

// ============ PHILOSOPHY & ETHICS (25) ============
{cat:'philosophy',w:'ethics',pos:'n.',en:'moral principles that govern a person’s behavior or the conducting of an activity',th:'จริยธรรม/จรรยาบรรณ',use:'ใช้กับ code of, professional',ex:['Doctors follow a code of ethics.','The company has strict business ethics.','Professional ethics require lawyers to keep client information confidential.']},
{cat:'philosophy',w:'moral',pos:'adj.',en:'concerned with the principles of right and wrong behavior',th:'เกี่ยวกับศีลธรรม',use:'ใช้กับ obligation, dilemma',ex:['He felt a moral obligation to help.','It raised a difficult moral question.','She faced a moral dilemma between loyalty to her friend and telling the truth.']},
{cat:'philosophy',w:'morality',pos:'n.',en:'principles concerning the distinction between right and wrong conduct',th:'ศีลธรรม',use:'ใช้กับ question, sense of',ex:['They debated questions of morality.','She has a strong sense of morality.','Philosophers have long debated whether morality is universal or culturally defined.']},
{cat:'philosophy',w:'virtue',pos:'n.',en:'a positive moral quality regarded as good or admirable',th:'คุณธรรม',use:'ใช้กับ patience, practice',ex:['Patience is considered a virtue.','He values honesty as a virtue.','Ancient philosophers wrote extensively about which virtues lead to a good life.']},
{cat:'philosophy',w:'vice',pos:'n.',en:'an immoral or bad habit or behavior',th:'อบายมุข/ความชั่วร้าย',use:'ตรงข้ามกับ virtue',ex:['Gambling was his only vice.','Vice and virtue are opposites.','Some argue that a small vice is harmless as long as it harms no one else.']},
{cat:'philosophy',w:'dilemma',pos:'n.',en:'a situation requiring a choice between equally difficult options',th:'สถานการณ์กลืนไม่เข้าคายไม่ออก',use:'ใช้กับ ethical, face a',ex:['She faced a difficult dilemma.','It was an ethical dilemma.','Doctors sometimes face dilemmas where every available option carries a real risk.']},
{cat:'philosophy',w:'utilitarianism',pos:'n.',en:'the ethical theory that the best action is the one that maximizes overall happiness',th:'แนวคิดประโยชน์นิยม',use:'ใช้กับ theory of, apply',ex:['He studied utilitarianism at university.','Utilitarianism focuses on outcomes.','Critics argue utilitarianism can justify harming a few to benefit the majority.']},
{cat:'philosophy',w:'relativism',pos:'n.',en:'the view that truth or morality depends on perspective rather than being absolute',th:'สัมพัทธนิยม',use:'ใช้กับ moral, cultural',ex:['Moral relativism is a debated topic.','Cultural relativism respects differences.','Critics of relativism argue that some moral principles should apply universally.']},
{cat:'philosophy',w:'conscience',pos:'n.',en:'an inner sense of right and wrong that guides behavior',th:'มโนธรรม',use:'ใช้กับ clear, guilty',ex:['He acted according to his conscience.','She had a guilty conscience.','A troubled conscience kept him awake long after the decision was made.']},
{cat:'philosophy',w:'integrity',pos:'n.',en:'the quality of being honest and having strong moral principles',th:'ความซื่อสัตย์สุจริต/หลักการที่มั่นคง',use:'ใช้กับ maintain, professional',ex:['She acted with great integrity.','He maintained his integrity under pressure.','Maintaining professional integrity sometimes means refusing profitable but unethical work.']},
{cat:'philosophy',w:'hypocrisy',pos:'n.',en:'the practice of claiming moral standards one does not actually follow',th:'ความหน้าซื่อใจคด',use:'ใช้กับ accuse of, expose',ex:['She accused him of hypocrisy.','The scandal exposed political hypocrisy.','Critics pointed to a clear hypocrisy between what the leader preached and how he behaved.']},
{cat:'philosophy',w:'altruism',pos:'n.',en:'unselfish concern for the wellbeing of others',th:'ความเสียสละเพื่อผู้อื่น',use:'ใช้กับ act of, pure',ex:['Volunteering is an act of altruism.','True altruism expects nothing in return.','Scientists debate whether pure altruism exists or if all kindness carries some self-interest.']},
{cat:'philosophy',w:'egoism',pos:'n.',en:'the belief that self-interest is the proper foundation of morality',th:'อัตตานิยม/การเห็นแก่ตัวเป็นหลักการ',use:'ตรงข้ามกับ altruism',ex:['He was accused of egoism.','Egoism prioritizes self-interest.','Ethical egoism holds that acting in one’s own interest is not only natural but morally correct.']},
{cat:'philosophy',w:'free will',pos:'phrase',en:'the ability to choose one’s own actions without external constraint',th:'เจตจำนงเสรี',use:'ใช้กับ believe in, exercise',ex:['She believes in free will.','We exercise free will daily.','Philosophers continue to debate whether free will truly exists or is an illusion.']},
{cat:'philosophy',w:'determinism',pos:'n.',en:'the belief that all events are determined by prior causes, leaving no room for free choice',th:'ตัดสินนิยม',use:'ตรงข้ามกับ free will',ex:['Determinism challenges the idea of choice.','He argued in favor of determinism.','Strict determinism suggests that every decision was already inevitable long before it was made.']},
{cat:'philosophy',w:'existential',pos:'adj.',en:'relating to human existence and its meaning',th:'เกี่ยวกับการดำรงอยู่ (ปรัชญา)',use:'ใช้กับ crisis, question',ex:['He had an existential crisis.','The film raises existential questions.','Facing mortality often triggers deep existential reflection about the meaning of life.']},
{cat:'philosophy',w:'metaphysical',pos:'adj.',en:'relating to abstract concepts such as existence, reality, and being',th:'อภิปรัชญา (เหนือธรรมชาติ/นามธรรม)',use:'ใช้กับ question, concept',ex:['They discussed metaphysical questions.','The idea is purely metaphysical.','Metaphysical questions about the nature of reality have puzzled philosophers for centuries.']},
{cat:'philosophy',w:'epistemology',pos:'n.',en:'the branch of philosophy concerned with the nature and limits of knowledge',th:'ญาณวิทยา',use:'ใช้กับ study, branch of',ex:['Epistemology studies how we know things.','She specializes in epistemology.','Epistemology asks fundamental questions about what counts as genuine knowledge.']},
{cat:'philosophy',w:'rhetoric',pos:'n.',en:'the art of persuasive speaking or writing',th:'วาทศิลป์',use:'ใช้กับ political, empty',ex:['The speech was full of rhetoric.','Political rhetoric can be persuasive.','Behind the passionate rhetoric, the policy itself remained vague and unclear.']},
{cat:'philosophy',w:'fallacy',pos:'n.',en:'a mistaken belief or a flaw in reasoning',th:'การให้เหตุผลผิดพลาด/มายาคติ',use:'ใช้กับ logical, common',ex:['That’s a common fallacy.','The argument contains a logical fallacy.','Recognizing logical fallacies helps people evaluate arguments more critically.']},
{cat:'philosophy',w:'conundrum',pos:'n.',en:'a confusing or difficult problem',th:'ปัญหาที่ยากจะแก้ไข/ปริศนาที่ซับซ้อน',use:'ใช้กับ face a, solve',ex:['They faced a difficult conundrum.','The riddle was a real conundrum.','Balancing economic growth with environmental protection remains a persistent conundrum for policymakers.']},
{cat:'philosophy',w:'pragmatism',pos:'n.',en:'an approach that deals with problems in a practical rather than theoretical way',th:'แนวคิดปฏิบัตินิยม',use:'ใช้กับ political, practical',ex:['Pragmatism guided his decisions.','The policy reflects political pragmatism.','Pragmatism favors what works in practice over what sounds ideal in theory.']},
{cat:'philosophy',w:'idealism',pos:'n.',en:'the belief in pursuing high standards or principles, sometimes regardless of practicality',th:'อุดมคตินิยม',use:'ตรงข้ามกับ pragmatism',ex:['Her idealism inspired others.','Youthful idealism often fades with age.','His idealism sometimes clashed with the harsh realities of practical politics.']},
{cat:'philosophy',w:'nihilism',pos:'n.',en:'the belief that life is without inherent meaning, purpose, or value',th:'นิฮิลลิสม์',use:'ใช้กับ philosophical, embrace',ex:['The novel explores nihilism.','He fell into a kind of nihilism.','Nihilism suggests that traditional values and beliefs ultimately have no real foundation.']},
{cat:'philosophy',w:'stoicism',pos:'n.',en:'the practice of enduring hardship without complaint, based on ancient philosophy',th:'แนวคิดสโตอิก (ความสงบนิ่งไม่หวั่นไหว)',use:'ใช้กับ practice, show',ex:['He faced the loss with stoicism.','Ancient stoicism teaches emotional control.','She responded to the crisis with remarkable stoicism, showing little visible distress.']},

// ============ DISASTER & EMERGENCY MANAGEMENT (25) ============
{cat:'disaster',w:'disaster',pos:'n.',en:'a sudden event causing great damage or loss of life',th:'ภัยพิบัติ',use:'ใช้กับ natural, cause',ex:['The flood was a natural disaster.','The disaster caused widespread damage.','Government agencies coordinated the response to the unfolding disaster.']},
{cat:'disaster',w:'catastrophe',pos:'n.',en:'an extremely serious and often sudden event causing great suffering or damage',th:'หายนะ/ความเสียหายร้ายแรง',use:'ใช้กับ avert, environmental',ex:['They tried to avert catastrophe.','The oil spill was an environmental catastrophe.','Quick action by rescue teams helped prevent an even greater catastrophe.']},
{cat:'disaster',w:'evacuate',pos:'v.',en:'to move people away from a dangerous place to somewhere safer',th:'อพยพออกจากพื้นที่',use:'ใช้กับ residents, immediately',ex:['Officials evacuated the town.','Residents were told to evacuate immediately.','Thousands of coastal residents were evacuated ahead of the approaching storm.']},
{cat:'disaster',w:'shelter',pos:'n./v.',en:'a place giving protection from danger or bad weather; to provide such protection',th:'ที่พักพิง/ให้ที่พักพิง',use:'ใช้กับ emergency, take',ex:['They took shelter from the storm.','The center offers emergency shelter.','Emergency shelters quickly filled with families displaced by the flooding.']},
{cat:'disaster',w:'casualty',pos:'n.',en:'a person killed or injured in an accident, disaster, or conflict',th:'ผู้บาดเจ็บหรือเสียชีวิต',use:'ใช้กับ number of, report',ex:['The storm caused several casualties.','Officials reported the number of casualties.','Emergency crews worked through the night to treat the growing number of casualties.']},
{cat:'disaster',w:'fatality',pos:'n.',en:'a death caused by an accident, disaster, or disease',th:'ผู้เสียชีวิต',use:'ใช้กับ report, prevent',ex:['The crash resulted in one fatality.','Officials worked to prevent further fatalities.','Improved warning systems have significantly reduced fatalities from major storms.']},
{cat:'disaster',w:'aftermath',pos:'n.',en:'the period following a harmful or unpleasant event',th:'ผลพวงหลังเหตุการณ์',use:'ใช้กับ in the, deal with',ex:['The city struggled in the aftermath.','They dealt with the storm’s aftermath.','Rebuilding continued for years in the aftermath of the devastating earthquake.']},
{cat:'disaster',w:'relief',pos:'n.',en:'aid provided to people affected by a disaster or hardship',th:'ความช่วยเหลือบรรเทาทุกข์',use:'ใช้กับ disaster, provide',ex:['Aid workers provided disaster relief.','Relief supplies arrived quickly.','International organizations sent emergency relief to the flood-affected region.']},
{cat:'disaster',w:'rescue',pos:'n./v.',en:'to save someone from danger; the act of saving someone',th:'การกู้ภัย/ช่วยเหลือ',use:'ใช้กับ team, operation',ex:['The team launched a rescue operation.','Firefighters rescued the trapped family.','The dramatic rescue was broadcast live on national television.']},
{cat:'disaster',w:'preparedness',pos:'n.',en:'the state of being ready to deal with a possible emergency or crisis',th:'ความพร้อมรับมือ',use:'ใช้กับ disaster, improve',ex:['Disaster preparedness saves lives.','The city improved its preparedness.','Regular drills help improve community preparedness before a real emergency strikes.']},
{cat:'disaster',w:'containment',pos:'n.',en:'the action of keeping something harmful under control and preventing it from spreading',th:'การควบคุมสถานการณ์ไม่ให้ลุกลาม',use:'ใช้กับ efforts, strategy',ex:['Firefighters focused on containment.','Containment efforts slowed the outbreak.','Officials prioritized containment to stop the wildfire from reaching nearby homes.']},

let currentIndex = 0;
let currentList = vocab.map((v,i)=>i);
let activeCat = 'all';
let flipped = false;

const tabsEl = document.getElementById('tabs');
const cardEl = document.getElementById('card');
const faceFront = document.getElementById('faceFront');
const faceBack = document.getElementById('faceBack');
const counterEl = document.getElementById('counter');
const metaLine = document.getElementById('metaLine');
const searchInput = document.getElementById('searchInput');

function catInfo(id){ return categories.find(c=>c.id===id); }

function buildTabs(){
  const all = document.createElement('button');
  all.className = 'tab' + (activeCat==='all' ? ' active':'');
  all.textContent = `ทั้งหมด (${vocab.length})`;
  all.style.background = '#8A8577';
  all.onclick = ()=>{ activeCat='all'; applyFilter(); };
  tabsEl.appendChild(all);
  categories.forEach(c=>{
    const count = vocab.filter(v=>v.cat===c.id).length;
    const btn = document.createElement('button');
    btn.className = 'tab' + (activeCat===c.id ? ' active':'');
    btn.textContent = `${c.name} (${count})`;
    btn.style.background = c.color;
    btn.onclick = ()=>{ activeCat=c.id; applyFilter(); };
    tabsEl.appendChild(btn);
  });
}

function applyFilter(){
  const q = searchInput.value.trim().toLowerCase();
  currentList = vocab
    .map((v,i)=>i)
    .filter(i=>{
      const v = vocab[i];
      const matchCat = activeCat==='all' || v.cat===activeCat;
      const matchSearch = !q || v.w.toLowerCase().includes(q) || v.th.includes(q);
      return matchCat && matchSearch;
    });
  currentIndex = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  Array.from(tabsEl.children).forEach((el,idx)=>{
    el.classList.remove('active');
  });
  Array.from(tabsEl.children).forEach((el)=>{
    const isAll = el.textContent.startsWith('ทั้งหมด');
    if(activeCat==='all' && isAll) el.classList.add('active');
  });
  categories.forEach((c,idx)=>{
    const el = tabsEl.children[idx+1];
    if(activeCat===c.id) el.classList.add('active');
  });
  render();
}

function render(){
  if(currentList.length===0){
    faceFront.innerHTML = '<div class="empty-state">ไม่พบคำศัพท์ที่ค้นหา</div>';
    faceBack.innerHTML = '';
    counterEl.innerHTML = '';
    metaLine.textContent = '';
    document.getElementById('prevBtn').disabled = true;
    document.getElementById('nextBtn').disabled = true;
    return;
  }
  const v = vocab[currentList[currentIndex]];
  const c = catInfo(v.cat);
  document.documentElement.style.setProperty('--accent', c.color);
  cardEl.style.setProperty('--accent', c.color);
  cardEl.style.setProperty('--accent-light', c.light);

  faceFront.innerHTML = `
    <div class="cat-chip">${c.name}</div>
    <div class="word-front">${v.w}</div>
    <div class="pos">${v.pos}</div>
    <div class="flip-hint">แตะการ์ดเพื่อดูความหมาย และตัวอย่างประโยค</div>
  `;
  faceBack.innerHTML = `
    <div class="cat-chip">${c.name}</div>
    <div class="word-back">${v.w} <span style="font-size:13px;color:var(--ink-soft);font-weight:400;font-style:italic;">${v.pos}</span></div>
    <div class="en-def"><span class="en-def-label">EN</span>${v.en}</div>
    <div class="th-meaning"><span class="th-meaning-label">TH</span>${v.th}</div>
    <div class="usage"><b>วิธีใช้:</b> ${v.use}</div>
    <div class="ex-label">ตัวอย่างประโยค (ง่าย → ซับซ้อน)</div>
    <ul class="ex-list">
      ${v.ex.map((s,i)=>`<li data-n="${i+1}">${s}</li>`).join('')}
    </ul>
  `;
  counterEl.innerHTML = `การ์ดที่ <b>${currentIndex+1}</b> จาก <b>${currentList.length}</b>`;
  metaLine.textContent = `รวมทั้งหมด ${vocab.length} คำ · 6 หมวดหมู่`;
  document.getElementById('prevBtn').disabled = currentIndex===0;
  document.getElementById('nextBtn').disabled = currentIndex===currentList.length-1;
}

cardEl.addEventListener('click', ()=>{
  if(currentList.length===0) return;
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
});

document.getElementById('prevBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  if(currentIndex>0){ currentIndex--; flipped=false; cardEl.classList.remove('flipped'); render(); }
});
document.getElementById('nextBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  if(currentIndex<currentList.length-1){ currentIndex++; flipped=false; cardEl.classList.remove('flipped'); render(); }
});
document.getElementById('shuffleBtn').addEventListener('click', ()=>{
  for(let i=currentList.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [currentList[i],currentList[j]] = [currentList[j],currentList[i]];
  }
  currentIndex = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  render();
});
searchInput.addEventListener('input', applyFilter);

document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') document.getElementById('nextBtn').click();
  if(e.key==='ArrowLeft') document.getElementById('prevBtn').click();
  if(e.key===' '){ e.preventDefault(); cardEl.click(); }
});

buildTabs();
applyFilter();
</script>
