<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Advanced Vocabulary — คำศัพท์เตรียมสอบ IELTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC;
    --paper-line:#E4DFD2;
    --ink:#2B2822;
    --ink-soft:#6B6558;
    --card-bg:#FFFDF8;
    --shadow:rgba(43,40,34,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans Thai','Inter',sans-serif;
    background:
      repeating-linear-gradient(180deg, transparent, transparent 35px, var(--paper-line) 36px),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  /* Header */
  header{margin-bottom:22px;}
  .title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(26px,5vw,34px);
    margin:0;
    letter-spacing:-0.01em;
  }
  .set-badge{
    font-size:11.5px;font-weight:700;color:#fff;background:var(--ink);
    padding:4px 10px;border-radius:20px;letter-spacing:.02em;
    transform:translateY(-2px);
  }
  .title-th{font-family:'Noto Serif Thai',serif;font-size:16px;color:var(--ink-soft);margin:4px 0 0;}
  .meta-line{font-size:13px;color:var(--ink-soft);margin-top:10px;}

  /* Search */
  .search-box{margin:18px 0 14px;position:relative;}
  .search-box input{
    width:100%;
    padding:11px 14px 11px 38px;
    border-radius:10px;
    border:1.5px solid var(--paper-line);
    background:var(--card-bg);
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  .search-box input:focus{border-color:var(--ink-soft);}
  .search-box::before{
    content:"🔍";
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    font-size:14px;opacity:.55;
  }

  /* Category tabs styled like binder index tabs */
  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:20px;
    scrollbar-width:thin;
  }
  .tab{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:8px 8px 0 0;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    border:none;
    color:#fff;
    opacity:.55;
    transition:opacity .15s ease, transform .12s ease;
    white-space:nowrap;
  }
  .tab:hover{opacity:.8;}
  .tab.active{opacity:1;transform:translateY(-2px);}

  /* Flashcard */
  .card-stage{
    perspective:1400px;
    margin-bottom:16px;
  }
  .card{
    position:relative;
    width:100%;
    min-height:340px;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    border-radius:16px;
    background:var(--card-bg);
    box-shadow:0 10px 30px var(--shadow), 0 1px 0 rgba(255,255,255,.6) inset;
    border-left:7px solid var(--accent, #6A4C93);
    padding:30px 28px;
    display:flex;
    flex-direction:column;
  }
  .face-back{transform:rotateY(180deg);overflow-y:auto;}

  .cat-chip{
    align-self:flex-start;
    font-size:11.5px;
    font-weight:700;
    color:var(--accent, #6A4C93);
    background:var(--accent-light, #EFE7F5);
    padding:3px 10px;
    border-radius:20px;
    margin-bottom:16px;
    letter-spacing:.02em;
  }
  .word-front{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(32px,7vw,44px);
    line-height:1.1;
    margin:0 0 8px;
  }
  .pos{font-size:14px;color:var(--ink-soft);font-style:italic;margin-bottom:auto;}
  .flip-hint{
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed var(--paper-line);
  }

  .word-back{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin:0 0 4px;
  }
  .en-def{
    font-size:14px;
    color:var(--ink);
    margin:0 0 10px;
    line-height:1.6;
    padding-left:1px;
  }
  .en-def-label{
    font-size:10.5px;font-weight:700;letter-spacing:.04em;
    color:var(--accent,#6A4C93);margin-right:6px;
  }
  .th-meaning{
    font-family:'Noto Serif Thai',serif;
    font-size:16px;
    color:var(--ink);
    margin:0 0 14px;
    line-height:1.55;
  }
  .th-meaning-label{
    font-size:10.5px;font-weight:700;letter-spacing:.04em;
    font-family:'Noto Sans Thai',sans-serif;
    color:var(--accent,#6A4C93);margin-right:6px;
  }
  .usage{
    font-size:13.5px;
    color:var(--ink-soft);
    background:var(--paper);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:16px;
    line-height:1.6;
  }
  .usage b{color:var(--ink);}
  .ex-label{font-size:12px;font-weight:700;color:var(--accent,#6A4C93);letter-spacing:.03em;margin-bottom:8px;}
  .ex-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .ex-list li{
    font-size:14px;
    line-height:1.55;
    padding-left:22px;
    position:relative;
  }
  .ex-list li::before{
    content:attr(data-n);
    position:absolute;left:0;top:1px;
    font-size:11px;font-weight:700;
    color:#fff;background:var(--accent,#6A4C93);
    width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .ex-list mark{
    background:var(--accent-light,#EFE7F5);
    color:var(--accent,#6A4C93);
    padding:0 3px;
    border-radius:3px;
    font-weight:600;
  }

  /* Controls */
  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:18px;
  }
  .nav-btn{
    background:var(--card-bg);
    border:1.5px solid var(--paper-line);
    border-radius:10px;
    width:44px;height:44px;
    font-size:18px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease;
    flex:0 0 auto;
  }
  .nav-btn:hover{background:var(--paper);}
  .nav-btn:disabled{opacity:.35;cursor:default;}
  .counter{
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    flex:1;
  }
  .counter b{color:var(--ink);}
  .shuffle-btn{
    background:var(--card-bg);
    border:1.5px solid var(--paper-line);
    border-radius:10px;
    padding:0 16px;height:44px;
    font-size:13px;font-weight:600;
    font-family:inherit;
    cursor:pointer;
    color:var(--ink);
    display:flex;align-items:center;gap:6px;
    flex:0 0 auto;
  }
  .shuffle-btn:hover{background:var(--paper);}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:14px;
  }

  @media (max-width:480px){
    .face{padding:24px 20px;}
    .controls{flex-wrap:wrap;}
    .counter{order:3;width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-row">
      <h1>IELTS Advanced Vocabulary</h1>
      <span class="set-badge">ชุดที่ 8</span>
    </div>
    <p class="title-th">คำศัพท์ขั้นสูง 150 คำ แบ่งตามหัวข้อ พร้อมคำจำกัดความภาษาอังกฤษ ความหมายไทย วิธีใช้ และตัวอย่างประโยค 3 ระดับ</p>
    <p class="meta-line" id="metaLine"></p>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="ค้นหาคำศัพท์ หรือ พิมพ์คำแปลไทย...">
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="card-stage">
    <div class="card" id="card">
      <div class="face face-front" id="faceFront"></div>
      <div class="face face-back" id="faceBack"></div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" title="คำก่อนหน้า">←</button>
    <div class="counter" id="counter"></div>
    <button class="nav-btn" id="nextBtn" title="คำถัดไป">→</button>
  </div>
  <div class="controls" style="margin-top:10px;justify-content:center;">
    <button class="shuffle-btn" id="shuffleBtn">🔀 สุ่มลำดับ</button>
  </div>
</div>

<script>
const categories = [
  {id:'chemistry', name:'เคมี-วัสดุศาสตร์', color:'#2E6B6B', light:'#DCE9E9'},
  {id:'compsci', name:'วิทยาการคอมพิวเตอร์-การเขียนโปรแกรม', color:'#3F5C8A', light:'#DEE5EF'},
  {id:'geography', name:'ภูมิศาสตร์-การทำแผนที่', color:'#4A7A5C', light:'#E1EDE3'},
  {id:'music', name:'ทฤษฎีดนตรี-การแสดง', color:'#8A4A6B', light:'#EDE0E7'},
  {id:'nutrition', name:'โภชนาการ-อาหารศาสตร์', color:'#6B8A3F', light:'#E7EDDC'},
  {id:'insurance', name:'ประกันภัย-การบริหารความเสี่ยง', color:'#5C4A3F', light:'#E7E2DC'},
];

const vocab = [

// ============ CHEMISTRY & MATERIALS SCIENCE (25) ============
{cat:'chemistry',w:'compound',pos:'n.',en:'a substance made of two or more elements chemically joined together',th:'สารประกอบ',use:'ใช้กับ chemical, form a',ex:['Water is a chemical compound.','Scientists formed a new compound.','This organic compound is widely used in the production of plastics.']},
{cat:'chemistry',w:'element',pos:'n.',en:'a pure chemical substance consisting of one type of atom',th:'ธาตุ',use:'ใช้กับ chemical, periodic table',ex:['Oxygen is a chemical element.','The periodic table lists all elements.','Each element has a unique number of protons in its atomic nucleus.']},
{cat:'chemistry',w:'reaction',pos:'n.',en:'a process in which substances interact to form new substances',th:'ปฏิกิริยาเคมี',use:'ใช้กับ chemical, trigger',ex:['The chemical reaction produced heat.','Light can trigger a reaction.','The reaction between the two chemicals released a large amount of energy.']},
{cat:'chemistry',w:'solvent',pos:'n.',en:'a substance that dissolves another substance to form a solution',th:'ตัวทำละลาย',use:'ใช้กับ organic, use as',ex:['Water is a common solvent.','They used an organic solvent.','The paint requires a strong solvent to remove it completely from surfaces.']},
{cat:'chemistry',w:'solute',pos:'n.',en:'a substance that is dissolved in a solvent to form a solution',th:'ตัวถูกละลาย',use:'ใช้กับ dissolve, concentration of',ex:['Salt is the solute in seawater.','The solute dissolved completely.','Increasing the concentration of solute changes the solution’s properties.']},
{cat:'chemistry',w:'concentration',pos:'n.',en:'the amount of a substance present in a given volume of solution',th:'ความเข้มข้น',use:'ใช้กับ measure, high',ex:['They measured the solution’s concentration.','A high concentration can be dangerous.','Scientists carefully adjusted the concentration to achieve the desired reaction.']},
{cat:'chemistry',w:'atom',pos:'n.',en:'the smallest unit of a chemical element that retains its properties',th:'อะตอม',use:'ใช้กับ structure of, split',ex:['Every atom has a nucleus.','Scientists learned to split the atom.','The structure of an atom includes protons, neutrons, and electrons.']},
{cat:'chemistry',w:'chemical bond',pos:'phrase',en:'the force that holds atoms together within a molecule',th:'พันธะเคมี',use:'ใช้กับ form, break',ex:['Atoms form a chemical bond.','Heat can break a chemical bond.','A strong chemical bond makes the compound highly stable.']},
{cat:'chemistry',w:'acid',pos:'n.',en:'a substance that reacts with a base and typically has a sour taste and low pH',th:'กรด',use:'ใช้กับ strong, neutralize',ex:['Lemon juice contains acid.','They neutralized the acid.','Strong acid can cause severe burns if it comes into contact with skin.']},
{cat:'chemistry',w:'alkali',pos:'n.',en:'a substance with a pH greater than 7 that neutralizes acids',th:'ด่าง',use:'ใช้กับ strong, react with',ex:['Soap is a mild alkali.','The alkali reacted with the acid.','Mixing a strong alkali with acid produces a neutralization reaction.']},
{cat:'chemistry',w:'pH level',pos:'phrase',en:'a measure of how acidic or alkaline a solution is',th:'ระดับพีเอช',use:'ใช้กับ measure, neutral',ex:['They measured the pH level.','A neutral pH level is 7.','Farmers regularly test the soil’s pH level to ensure healthy crop growth.']},
{cat:'chemistry',w:'corrosion',pos:'n.',en:'the gradual destruction of a material, especially metal, caused by chemical reactions',th:'การกัดกร่อน',use:'ใช้กับ prevent, cause',ex:['Rust is a form of corrosion.','Paint helps prevent corrosion.','Saltwater significantly accelerates corrosion in metal structures.']},
{cat:'chemistry',w:'alloy',pos:'n.',en:'a metal made by combining two or more metallic elements',th:'โลหะผสม',use:'ใช้กับ create, strong',ex:['Bronze is an alloy of copper and tin.','Engineers created a stronger alloy.','This lightweight alloy is widely used in aircraft manufacturing.']},
{cat:'chemistry',w:'polymer',pos:'n.',en:'a large molecule made up of many repeated smaller units',th:'พอลิเมอร์',use:'ใช้กับ synthetic, develop',ex:['Plastic is made from polymers.','Scientists developed a new polymer.','This synthetic polymer is both flexible and resistant to heat.']},
{cat:'chemistry',w:'composite material',pos:'phrase',en:'a material made by combining two or more distinct substances to create improved properties',th:'วัสดุผสม',use:'ใช้กับ develop, lightweight',ex:['The frame uses a composite material.','Engineers developed a lightweight composite material.','Composite materials combine the strength of one substance with the flexibility of another.']},
{cat:'chemistry',w:'conductivity',pos:'n.',en:'the ability of a material to allow electricity or heat to pass through it',th:'สภาพนำไฟฟ้า/นำความร้อน',use:'ใช้กับ electrical, high',ex:['Copper has high electrical conductivity.','They measured the material’s conductivity.','Scientists are researching materials with even higher thermal conductivity.']},
{cat:'chemistry',w:'insulation',pos:'n.',en:'a material used to prevent the transfer of heat, electricity, or sound',th:'ฉนวน',use:'ใช้กับ thermal, install',ex:['The walls have thermal insulation.','They installed better insulation.','Proper insulation significantly reduces a building’s overall energy consumption.']},
{cat:'chemistry',w:'density',pos:'n.',en:'the mass of a substance per unit volume',th:'ความหนาแน่น',use:'ใช้กับ measure, high',ex:['Gold has a high density.','Scientists measured the material’s density.','Materials with low density are often preferred for aircraft construction.']},
{cat:'chemistry',w:'viscosity',pos:'n.',en:'the thickness or resistance of a liquid to flow',th:'ความหนืด',use:'ใช้กับ measure, high',ex:['Honey has a high viscosity.','Engineers measured the oil’s viscosity.','Temperature significantly affects the viscosity of most liquids.']},
{cat:'chemistry',w:'crystalline',pos:'adj.',en:'having the regular, repeating structure of a crystal',th:'เป็นผลึก',use:'ใช้กับ structure, form',ex:['Salt has a crystalline structure.','The mineral forms crystalline shapes.','The material’s crystalline structure gives it remarkable strength.']},
{cat:'chemistry',w:'oxidation',pos:'n.',en:'a chemical reaction in which a substance combines with oxygen',th:'ปฏิกิริยาออกซิเดชัน',use:'ใช้กับ cause, prevent',ex:['Oxidation causes metal to rust.','They coated the metal to prevent oxidation.','Oxidation gradually weakens the structural strength of exposed metal.']},
{cat:'chemistry',w:'reactive',pos:'adj.',en:'likely to react chemically with other substances',th:'ว่องไวต่อปฏิกิริยา',use:'ใช้กับ highly, chemically',ex:['Sodium is highly reactive.','The gas is chemically reactive.','Highly reactive substances must be stored under strict safety conditions.']},
{cat:'chemistry',w:'tensile strength',pos:'phrase',en:'the maximum stress a material can withstand while being stretched before breaking',th:'ความแข็งแรงต่อแรงดึง',use:'ใช้กับ test, high',ex:['Engineers tested the tensile strength.','The cable has high tensile strength.','Materials with greater tensile strength are essential for suspension bridges.']},
{cat:'chemistry',w:'malleable',pos:'adj.',en:'(of a material) able to be shaped or bent without breaking',th:'สามารถตีให้เป็นแผ่นได้/ยืดหยุ่น',use:'ใช้กับ metal, highly',ex:['Gold is a highly malleable metal.','The material remains malleable when heated.','Malleable metals can be hammered into thin sheets without cracking.']},
{cat:'chemistry',w:'brittle',pos:'adj.',en:'hard but easily broken or shattered',th:'เปราะ/แตกหักง่าย',use:'ตรงข้ามกับ malleable',ex:['Glass is brittle when cold.','The old plastic became brittle.','Brittle materials tend to crack suddenly rather than bend under stress.']},

// ============ COMPUTER SCIENCE & PROGRAMMING (25) ============
{cat:'compsci',w:'software',pos:'n.',en:'programs and instructions that run on a computer',th:'ซอฟต์แวร์',use:'ใช้กับ install, update',ex:['They installed new software.','The software needs an update.','The company develops software used by millions of people worldwide.']},
{cat:'compsci',w:'hardware',pos:'n.',en:'the physical components of a computer system',th:'ฮาร์ดแวร์',use:'ใช้กับ upgrade, faulty',ex:['They upgraded the hardware.','Faulty hardware caused the crash.','Modern hardware allows software to run significantly faster than before.']},
{cat:'compsci',w:'code',pos:'n./v.',en:'instructions written in a programming language; to write such instructions',th:'โค้ดโปรแกรม/เขียนโค้ด',use:'ใช้กับ write, review',ex:['She writes code every day.','They reviewed the code carefully.','Clean, well-organized code is much easier for other developers to maintain.']},
{cat:'compsci',w:'debug',pos:'v.',en:'to find and fix errors in computer code',th:'แก้ไขข้อผิดพลาดในโปรแกรม',use:'ใช้กับ code, spend hours',ex:['He debugged the program.','They spent hours debugging the code.','Debugging complex software can take far longer than writing it in the first place.']},
{cat:'compsci',w:'compile',pos:'v.',en:'to convert programming code into a form a computer can execute',th:'คอมไพล์ (แปลงโค้ดเป็นภาษาเครื่อง)',use:'ใช้กับ program, fail to',ex:['The program failed to compile.','They compiled the new code.','A single missing symbol can cause the entire program to fail to compile.']},
{cat:'compsci',w:'function',pos:'n.',en:'a block of code designed to perform a specific task',th:'ฟังก์ชัน (ในโปรแกรม)',use:'ใช้กับ call, define',ex:['The program calls a function.','She defined a new function.','Breaking code into small functions makes it much easier to test and reuse.']},
{cat:'compsci',w:'database',pos:'n.',en:'an organized collection of data stored and accessed electronically',th:'ฐานข้อมูล',use:'ใช้กับ store in, query',ex:['Customer records are stored in a database.','They queried the database.','A well-designed database allows information to be retrieved quickly and reliably.']},
{cat:'compsci',w:'server',pos:'n.',en:'a computer or system that provides data or services to other computers',th:'เซิร์ฟเวอร์',use:'ใช้กับ crash, host on',ex:['The server crashed overnight.','The website is hosted on a server.','High traffic overwhelmed the server, causing the website to go offline.']},
{cat:'compsci',w:'open-source',pos:'adj.',en:'(of software) with its source code freely available for anyone to use or modify',th:'โอเพนซอร์ส (โค้ดเปิดเผยให้ใช้และแก้ไขได้)',use:'ใช้กับ software, project',ex:['The project is open-source.','Many developers contribute to open-source software.','Open-source software allows anyone to review, modify, and improve the code.']},
{cat:'compsci',w:'framework',pos:'n.',en:'a pre-built structure of code that provides a foundation for developing software',th:'เฟรมเวิร์ก (โครงสร้างพื้นฐานสำหรับพัฒนาซอฟต์แวร์)',use:'ใช้กับ use, popular',ex:['Developers use a popular framework.','The framework speeds up development.','Choosing the right framework can significantly speed up software development.']},
{cat:'compsci',w:'programming language',pos:'phrase',en:'a formal language used to write instructions that a computer can execute',th:'ภาษาโปรแกรม',use:'ใช้กับ learn, popular',ex:['She learned a new programming language.','Python is a popular programming language.','Each programming language has its own strengths depending on the task.']},
{cat:'compsci',w:'backend',pos:'n.',en:'the part of a software system that handles data processing, usually invisible to users',th:'ระบบหลังบ้าน (ส่วนประมวลผลข้อมูล)',use:'ใช้กับ develop, manage',ex:['He develops the backend.','The backend manages all user data.','The backend handles requests from the app before sending back a response.']},
{cat:'compsci',w:'frontend',pos:'n.',en:'the part of a software system that users interact with directly',th:'ส่วนหน้าบ้าน (ส่วนติดต่อผู้ใช้)',use:'ใช้กับ design, build',ex:['She designs the frontend.','They built a clean frontend.','A well-designed frontend makes the app easier and more enjoyable to use.']},
{cat:'compsci',w:'API',pos:'n.',en:'a set of rules that allows different software applications to communicate with each other',th:'เอพีไอ (ส่วนต่อประสานโปรแกรมประยุกต์)',use:'ใช้กับ integrate, use',ex:['The app uses a weather API.','Developers integrate the API.','The company published an API so other developers could connect to its platform.']},
{cat:'compsci',w:'version control',pos:'phrase',en:'a system that tracks and manages changes to code over time',th:'ระบบควบคุมเวอร์ชัน',use:'ใช้กับ use, system',ex:['Teams use version control.','The version control system tracks changes.','Version control allows multiple developers to work on the same project without conflicts.']},

let currentIndex = 0;
let currentList = vocab.map((v,i)=>i);
let activeCat = 'all';
let flipped = false;

const tabsEl = document.getElementById('tabs');
const cardEl = document.getElementById('card');
const faceFront = document.getElementById('faceFront');
const faceBack = document.getElementById('faceBack');
const counterEl = document.getElementById('counter');
const metaLine = document.getElementById('metaLine');
const searchInput = document.getElementById('searchInput');

function catInfo(id){ return categories.find(c=>c.id===id); }

function buildTabs(){
  const all = document.createElement('button');
  all.className = 'tab' + (activeCat==='all' ? ' active':'');
  all.textContent = `ทั้งหมด (${vocab.length})`;
  all.style.background = '#8A8577';
  all.onclick = ()=>{ activeCat='all'; applyFilter(); };
  tabsEl.appendChild(all);
  categories.forEach(c=>{
    const count = vocab.filter(v=>v.cat===c.id).length;
    const btn = document.createElement('button');
    btn.className = 'tab' + (activeCat===c.id ? ' active':'');
    btn.textContent = `${c.name} (${count})`;
    btn.style.background = c.color;
    btn.onclick = ()=>{ activeCat=c.id; applyFilter(); };
    tabsEl.appendChild(btn);
  });
}

function applyFilter(){
  const q = searchInput.value.trim().toLowerCase();
  currentList = vocab
    .map((v,i)=>i)
    .filter(i=>{
      const v = vocab[i];
      const matchCat = activeCat==='all' || v.cat===activeCat;
      const matchSearch = !q || v.w.toLowerCase().includes(q) || v.th.includes(q);
      return matchCat && matchSearch;
    });
  currentIndex = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  Array.from(tabsEl.children).forEach((el,idx)=>{
    el.classList.remove('active');
  });
  Array.from(tabsEl.children).forEach((el)=>{
    const isAll = el.textContent.startsWith('ทั้งหมด');
    if(activeCat==='all' && isAll) el.classList.add('active');
  });
  categories.forEach((c,idx)=>{
    const el = tabsEl.children[idx+1];
    if(activeCat===c.id) el.classList.add('active');
  });
  render();
}

function render(){
  if(currentList.length===0){
    faceFront.innerHTML = '<div class="empty-state">ไม่พบคำศัพท์ที่ค้นหา</div>';
    faceBack.innerHTML = '';
    counterEl.innerHTML = '';
    metaLine.textContent = '';
    document.getElementById('prevBtn').disabled = true;
    document.getElementById('nextBtn').disabled = true;
    return;
  }
  const v = vocab[currentList[currentIndex]];
  const c = catInfo(v.cat);
  document.documentElement.style.setProperty('--accent', c.color);
  cardEl.style.setProperty('--accent', c.color);
  cardEl.style.setProperty('--accent-light', c.light);

  faceFront.innerHTML = `
    <div class="cat-chip">${c.name}</div>
    <div class="word-front">${v.w}</div>
    <div class="pos">${v.pos}</div>
    <div class="flip-hint">แตะการ์ดเพื่อดูความหมาย และตัวอย่างประโยค</div>
  `;
  faceBack.innerHTML = `
    <div class="cat-chip">${c.name}</div>
    <div class="word-back">${v.w} <span style="font-size:13px;color:var(--ink-soft);font-weight:400;font-style:italic;">${v.pos}</span></div>
    <div class="en-def"><span class="en-def-label">EN</span>${v.en}</div>
    <div class="th-meaning"><span class="th-meaning-label">TH</span>${v.th}</div>
    <div class="usage"><b>วิธีใช้:</b> ${v.use}</div>
    <div class="ex-label">ตัวอย่างประโยค (ง่าย → ซับซ้อน)</div>
    <ul class="ex-list">
      ${v.ex.map((s,i)=>`<li data-n="${i+1}">${s}</li>`).join('')}
    </ul>
  `;
  counterEl.innerHTML = `การ์ดที่ <b>${currentIndex+1}</b> จาก <b>${currentList.length}</b>`;
  metaLine.textContent = `รวมทั้งหมด ${vocab.length} คำ · 6 หมวดหมู่`;
  document.getElementById('prevBtn').disabled = currentIndex===0;
  document.getElementById('nextBtn').disabled = currentIndex===currentList.length-1;
}

cardEl.addEventListener('click', ()=>{
  if(currentList.length===0) return;
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
});

document.getElementById('prevBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  if(currentIndex>0){ currentIndex--; flipped=false; cardEl.classList.remove('flipped'); render(); }
});
document.getElementById('nextBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  if(currentIndex<currentList.length-1){ currentIndex++; flipped=false; cardEl.classList.remove('flipped'); render(); }
});
document.getElementById('shuffleBtn').addEventListener('click', ()=>{
  for(let i=currentList.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [currentList[i],currentList[j]] = [currentList[j],currentList[i]];
  }
  currentIndex = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  render();
});
searchInput.addEventListener('input', applyFilter);

document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') document.getElementById('nextBtn').click();
  if(e.key==='ArrowLeft') document.getElementById('prevBtn').click();
  if(e.key===' '){ e.preventDefault(); cardEl.click(); }
});

buildTabs();
applyFilter();
</script>
