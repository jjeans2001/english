<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Advanced Vocabulary — คำศัพท์เตรียมสอบ IELTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC;
    --paper-line:#E4DFD2;
    --ink:#2B2822;
    --ink-soft:#6B6558;
    --card-bg:#FFFDF8;
    --shadow:rgba(43,40,34,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans Thai','Inter',sans-serif;
    background:
      repeating-linear-gradient(180deg, transparent, transparent 35px, var(--paper-line) 36px),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  /* Header */
  header{margin-bottom:22px;}
  .title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(26px,5vw,34px);
    margin:0;
    letter-spacing:-0.01em;
  }
  .set-badge{
    font-size:11.5px;font-weight:700;color:#fff;background:var(--ink);
    padding:4px 10px;border-radius:20px;letter-spacing:.02em;
    transform:translateY(-2px);
  }
  .title-th{font-family:'Noto Serif Thai',serif;font-size:16px;color:var(--ink-soft);margin:4px 0 0;}
  .meta-line{font-size:13px;color:var(--ink-soft);margin-top:10px;}

  /* Search */
  .search-box{margin:18px 0 14px;position:relative;}
  .search-box input{
    width:100%;
    padding:11px 14px 11px 38px;
    border-radius:10px;
    border:1.5px solid var(--paper-line);
    background:var(--card-bg);
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  .search-box input:focus{border-color:var(--ink-soft);}
  .search-box::before{
    content:"🔍";
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    font-size:14px;opacity:.55;
  }

  /* Category tabs styled like binder index tabs */
  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:20px;
    scrollbar-width:thin;
  }
  .tab{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:8px 8px 0 0;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    border:none;
    color:#fff;
    opacity:.55;
    transition:opacity .15s ease, transform .12s ease;
    white-space:nowrap;
  }
  .tab:hover{opacity:.8;}
  .tab.active{opacity:1;transform:translateY(-2px);}

  /* Flashcard */
  .card-stage{
    perspective:1400px;
    margin-bottom:16px;
  }
  .card{
    position:relative;
    width:100%;
    min-height:340px;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    border-radius:16px;
    background:var(--card-bg);
    box-shadow:0 10px 30px var(--shadow), 0 1px 0 rgba(255,255,255,.6) inset;
    border-left:7px solid var(--accent, #6A4C93);
    padding:30px 28px;
    display:flex;
    flex-direction:column;
  }
  .face-back{transform:rotateY(180deg);overflow-y:auto;}

  .cat-chip{
    align-self:flex-start;
    font-size:11.5px;
    font-weight:700;
    color:var(--accent, #6A4C93);
    background:var(--accent-light, #EFE7F5);
    padding:3px 10px;
    border-radius:20px;
    margin-bottom:16px;
    letter-spacing:.02em;
  }
  .word-front{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(32px,7vw,44px);
    line-height:1.1;
    margin:0 0 8px;
  }
  .pos{font-size:14px;color:var(--ink-soft);font-style:italic;margin-bottom:auto;}
  .flip-hint{
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed var(--paper-line);
  }

  .word-back{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin:0 0 4px;
  }
  .en-def{
    font-size:14px;
    color:var(--ink);
    margin:0 0 10px;
    line-height:1.6;
    padding-left:1px;
  }
  .en-def-label{
    font-size:10.5px;font-weight:700;letter-spacing:.04em;
    color:var(--accent,#6A4C93);margin-right:6px;
  }
  .th-meaning{
    font-family:'Noto Serif Thai',serif;
    font-size:16px;
    color:var(--ink);
    margin:0 0 14px;
    line-height:1.55;
  }
  .th-meaning-label{
    font-size:10.5px;font-weight:700;letter-spacing:.04em;
    font-family:'Noto Sans Thai',sans-serif;
    color:var(--accent,#6A4C93);margin-right:6px;
  }
  .usage{
    font-size:13.5px;
    color:var(--ink-soft);
    background:var(--paper);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:16px;
    line-height:1.6;
  }
  .usage b{color:var(--ink);}
  .ex-label{font-size:12px;font-weight:700;color:var(--accent,#6A4C93);letter-spacing:.03em;margin-bottom:8px;}
  .ex-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .ex-list li{
    font-size:14px;
    line-height:1.55;
    padding-left:22px;
    position:relative;
  }
  .ex-list li::before{
    content:attr(data-n);
    position:absolute;left:0;top:1px;
    font-size:11px;font-weight:700;
    color:#fff;background:var(--accent,#6A4C93);
    width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .ex-list mark{
    background:var(--accent-light,#EFE7F5);
    color:var(--accent,#6A4C93);
    padding:0 3px;
    border-radius:3px;
    font-weight:600;
  }

  /* Controls */
  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:18px;
  }
  .nav-btn{
    background:var(--card-bg);
    border:1.5px solid var(--paper-line);
    border-radius:10px;
    width:44px;height:44px;
    font-size:18px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease;
    flex:0 0 auto;
  }
  .nav-btn:hover{background:var(--paper);}
  .nav-btn:disabled{opacity:.35;cursor:default;}
  .counter{
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    flex:1;
  }
  .counter b{color:var(--ink);}
  .shuffle-btn{
    background:var(--card-bg);
    border:1.5px solid var(--paper-line);
    border-radius:10px;
    padding:0 16px;height:44px;
    font-size:13px;font-weight:600;
    font-family:inherit;
    cursor:pointer;
    color:var(--ink);
    display:flex;align-items:center;gap:6px;
    flex:0 0 auto;
  }
  .shuffle-btn:hover{background:var(--paper);}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:14px;
  }

  @media (max-width:480px){
    .face{padding:24px 20px;}
    .controls{flex-wrap:wrap;}
    .counter{order:3;width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-row">
      <h1>IELTS Advanced Vocabulary</h1>
      <span class="set-badge">ชุดที่ 1</span>
    </div>
    <p class="title-th">คำศัพท์ขั้นสูง 150 คำ แบ่งตามหัวข้อ พร้อมคำจำกัดความภาษาอังกฤษ ความหมายไทย วิธีใช้ และตัวอย่างประโยค 3 ระดับ</p>
    <p class="meta-line" id="metaLine"></p>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="ค้นหาคำศัพท์ หรือ พิมพ์คำแปลไทย...">
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="card-stage">
    <div class="card" id="card">
      <div class="face face-front" id="faceFront"></div>
      <div class="face face-back" id="faceBack"></div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" title="คำก่อนหน้า">←</button>
    <div class="counter" id="counter"></div>
    <button class="nav-btn" id="nextBtn" title="คำถัดไป">→</button>
  </div>
  <div class="controls" style="margin-top:10px;justify-content:center;">
    <button class="shuffle-btn" id="shuffleBtn">🔀 สุ่มลำดับ</button>
  </div>
</div>

<script>
const categories = [
  {id:'environment', name:'สิ่งแวดล้อม', color:'#3F6B4C', light:'#E3EEE5'},
  {id:'education',   name:'การศึกษา',    color:'#3A4E8C', light:'#E4E7F3'},
  {id:'technology',  name:'เทคโนโลยี',   color:'#2C7873', light:'#DFEFEE'},
  {id:'health',      name:'สุขภาพ',      color:'#9C3D54', light:'#F3E1E5'},
  {id:'economy',     name:'เศรษฐกิจ-สังคม', color:'#A9762F', light:'#F3E9D9'},
  {id:'academic',    name:'ศัพท์วิชาการ-โต้แย้ง', color:'#6A4C93', light:'#EFE7F5'},
];

const vocab = [
// ============ ENVIRONMENT (25) ============
{cat:'environment',w:'sustainable',pos:'adj.',en:'able to continue over a long period without causing damage or permanently using up resources',th:'ยั่งยืน — ดำเนินต่อไปได้โดยไม่ทำลายทรัพยากรในระยะยาว',use:'มักใช้คู่กับ development, growth, energy, practice',ex:['We should buy products from <mark>sustainable</mark> farms.','The city invested in sustainable public transport to cut emissions.','Balancing economic growth with environmental protection is the core challenge of sustainable development policy.']},
{cat:'environment',w:'renewable',pos:'adj.',en:'(of energy or resources) able to be replaced naturally and not permanently used up',th:'หมุนเวียนได้ / ใช้แล้วไม่หมด (เช่น พลังงาน)',use:'ใช้คู่กับ energy, resource, source',ex:['Solar power is a <mark>renewable</mark> source of energy.','More countries are switching to renewable energy to reduce fossil fuel use.','Government subsidies have accelerated the transition toward renewable infrastructure across the manufacturing sector.']},
{cat:'environment',w:'emission',pos:'n.',en:'a substance, especially gas, that is released into the air',th:'การปล่อย (ก๊าซ/มลพิษ)',use:'มักอยู่รูปพหูพจน์ emissions, ใช้กับ carbon, greenhouse gas',ex:['Cars produce harmful emissions.','The factory reduced its carbon emissions by installing new filters.','International agreements aim to cap national emission levels to limit global temperature rise.']},
{cat:'environment',w:'deforestation',pos:'n.',en:'the cutting down and clearing of trees or forests',th:'การตัดไม้ทำลายป่า',use:'มักใช้เป็นสาเหตุของปัญหาสิ่งแวดล้อมอื่นๆ',ex:['Deforestation destroys animal homes.','Widespread deforestation in the region has led to soil erosion.','Large-scale deforestation for agriculture has been linked to declining rainfall patterns in tropical areas.']},
{cat:'environment',w:'biodiversity',pos:'n.',en:'the variety of plant and animal life in a particular habitat or in the world',th:'ความหลากหลายทางชีวภาพ',use:'ใช้กับ loss of, threat to, protect',ex:['The rainforest has amazing biodiversity.','Pollution is a major threat to marine biodiversity.','Conservationists argue that protecting biodiversity is essential for maintaining stable, resilient ecosystems.']},
{cat:'environment',w:'ecosystem',pos:'n.',en:'a community of living things interacting with their physical environment',th:'ระบบนิเวศ',use:'ใช้กับ fragile, disrupt, balance of',ex:['A pond is a small ecosystem.','Overfishing can disrupt the entire marine ecosystem.','Human activity has disturbed the delicate balance of coastal ecosystems worldwide.']},
{cat:'environment',w:'conservation',pos:'n.',en:'the protection and careful management of the environment and natural resources',th:'การอนุรักษ์',use:'ใช้กับ wildlife, energy, efforts',ex:['Conservation helps protect endangered animals.','The park runs conservation programs to protect local species.','Long-term conservation efforts require cooperation between governments, scientists, and local communities.']},
{cat:'environment',w:'depletion',pos:'n.',en:'a reduction in the amount of something, especially a natural resource',th:'การร่อยหรอ/หมดไปของทรัพยากร',use:'ใช้กับ resource, ozone',ex:['Depletion of fish stocks worries fishermen.','Ozone depletion increases harmful UV radiation reaching the Earth.','Rapid depletion of groundwater reserves threatens agricultural sustainability in arid regions.']},
{cat:'environment',w:'contamination',pos:'n.',en:'the process of making something impure or polluted, especially with a harmful substance',th:'การปนเปื้อน',use:'ใช้กับ water, soil, air',ex:['Contamination made the river water unsafe.','Chemical contamination of the soil harmed local crops.','Industrial contamination of groundwater supplies has raised serious public health concerns in the region.']},
{cat:'environment',w:'degradation',pos:'n.',en:'the process of something becoming worse, especially in quality or condition',th:'ความเสื่อมโทรม',use:'ใช้กับ environmental, land, soil',ex:['Environmental degradation harms wildlife.','Land degradation reduces the amount of farmable soil.','Continued environmental degradation has accelerated species loss faster than scientists predicted.']},
{cat:'environment',w:'mitigate',pos:'v.',en:'to make a harmful or serious situation less severe',th:'บรรเทา / ลดผลกระทบ',use:'ใช้กับ risk, effect, impact + of',ex:['Trees help mitigate flooding.','New policies aim to mitigate the effects of climate change.','Engineers designed flood barriers to mitigate the risk of coastal damage during storms.']},
{cat:'environment',w:'deplete',pos:'v.',en:'to greatly reduce the amount of something that is available',th:'ทำให้ลดลง/หมดไป',use:'มักใช้ passive: be depleted',ex:['Farming can deplete the soil.','Overfishing has depleted many fish populations.','Natural gas reserves are being depleted faster than new sources can be discovered.']},
{cat:'environment',w:'hazardous',pos:'adj.',en:'risky or dangerous, especially to health or safety',th:'เป็นอันตราย',use:'ใช้กับ waste, material, chemical',ex:['The factory produces hazardous waste.','Workers must wear protection when handling hazardous chemicals.','Improper disposal of hazardous industrial waste can contaminate groundwater for decades.']},
{cat:'environment',w:'carbon footprint',pos:'phrase',en:'the total amount of greenhouse gases produced by a person, organization, or activity',th:'ปริมาณคาร์บอนที่ปล่อยจากกิจกรรมของบุคคล/องค์กร',use:'ใช้กับ reduce, leave a small/large',ex:['Riding a bike reduces your carbon footprint.','The company measured its carbon footprint to find ways to cut emissions.','Air travel contributes significantly to an individual’s overall carbon footprint compared to other transport modes.']},
{cat:'environment',w:'habitat',pos:'n.',en:'the natural home or environment of an animal or plant',th:'ถิ่นที่อยู่อาศัยตามธรรมชาติ',use:'ใช้กับ destroy, natural, loss of',ex:['Birds build nests in their habitat.','Logging destroys the natural habitat of many species.','Coastal development continues to erode critical habitat for migratory bird populations.']},
{cat:'environment',w:'drought',pos:'n.',en:'a long period of unusually low rainfall that leads to a shortage of water',th:'ภัยแล้ง',use:'ใช้กับ severe, prolonged, suffer from',ex:['The farm suffered during the drought.','A severe drought destroyed most of the region’s crops.','Prolonged droughts linked to climate change have devastated agricultural output across East Africa.']},
{cat:'environment',w:'erosion',pos:'n.',en:'the gradual wearing away of soil or rock by wind, water, or other natural forces',th:'การกัดเซาะ',use:'ใช้กับ soil, coastal, prevent',ex:['Wind causes erosion on hills.','Tree roots help prevent soil erosion.','Coastal erosion has already claimed several villages along the eroding shoreline.']},
{cat:'environment',w:'scarcity',pos:'n.',en:'the state of not having enough of something that is needed',th:'ความขาดแคลน',use:'ใช้กับ water, food, resource',ex:['Water scarcity is a big problem.','Food scarcity forced families to migrate to the city.','Growing water scarcity in the region has heightened tensions between neighboring countries over shared rivers.']},
{cat:'environment',w:'toxic',pos:'adj.',en:'poisonous or harmful to living things',th:'เป็นพิษ',use:'ใช้กับ chemical, waste, gas',ex:['The gas is toxic to breathe.','Toxic waste was dumped illegally near the village.','Prolonged exposure to toxic industrial fumes has been linked to serious respiratory illness.']},
{cat:'environment',w:'endangered',pos:'adj.',en:'(of a species) seriously at risk of becoming extinct',th:'ใกล้สูญพันธุ์',use:'ใช้กับ species, animal',ex:['The panda is an endangered species.','Hunting has made this animal endangered.','Poaching remains the single greatest threat to several critically endangered large mammal species.']},
{cat:'environment',w:'greenhouse effect',pos:'phrase',en:'the trapping of the sun’s warmth in a planet’s atmosphere by certain gases',th:'ปรากฏการณ์เรือนกระจก',use:'อธิบายสาเหตุของ global warming',ex:['The greenhouse effect warms the Earth.','Carbon dioxide contributes to the greenhouse effect.','Human-produced gases have intensified the natural greenhouse effect, driving unprecedented global warming.']},
{cat:'environment',w:'pesticide',pos:'n.',en:'a chemical substance used to kill insects or other pests that damage crops',th:'ยาฆ่าแมลง',use:'ใช้กับ spray, use, harmful',ex:['Farmers spray pesticide on crops.','Pesticide residue can remain on fruit and vegetables.','Overuse of pesticides has been shown to harm bee populations essential for pollination.']},
{cat:'environment',w:'sewage',pos:'n.',en:'waste water and human waste that is carried away in drains or sewers',th:'น้ำเสีย/สิ่งปฏิกูล',use:'ใช้กับ treat, dispose of, system',ex:['Sewage flowed into the river.','The city built a plant to treat sewage safely.','Untreated sewage discharged into rivers remains a leading cause of waterborne disease in developing regions.']},
{cat:'environment',w:'landfill',pos:'n.',en:'a site where waste is buried under layers of earth',th:'หลุมฝังกลบขยะ',use:'ใช้กับ waste ends up in, reduce',ex:['Trash is buried in a landfill.','Recycling helps reduce waste sent to landfills.','Most single-use plastics eventually end up in overflowing municipal landfills that take centuries to decompose.']},
{cat:'environment',w:'fossil fuel',pos:'phrase',en:'a natural fuel such as coal, oil, or gas, formed from the remains of ancient organisms',th:'เชื้อเพลิงฟอสซิล (น้ำมัน ถ่านหิน ก๊าซ)',use:'ตรงข้ามกับ renewable energy',ex:['Cars usually run on fossil fuel.','Burning fossil fuels releases carbon dioxide.','Reducing dependency on fossil fuels is central to most national climate strategies.']},

// ============ EDUCATION (25) ============
{cat:'education',w:'curriculum',pos:'n.',en:'the subjects and content that are taught in a school or course',th:'หลักสูตร',use:'ใช้กับ design, revise, include in',ex:['Math is part of the school curriculum.','The university revised its curriculum to include more technology courses.','Critics argue the national curriculum places too little emphasis on critical thinking skills.']},
{cat:'education',w:'literacy',pos:'n.',en:'the ability to read and write',th:'ความสามารถในการอ่านเขียน / ความรู้ความเข้าใจ',use:'ใช้กับ rate, digital, financial',ex:['Literacy rates have improved in the country.','Digital literacy is now taught alongside traditional subjects.','Improving adult literacy remains a key priority for governments tackling long-term poverty.']},
{cat:'education',w:'pedagogy',pos:'n.',en:'the method and practice of teaching',th:'วิธีการสอน / การจัดการเรียนการสอน',use:'คำเชิงวิชาการ มักใช้ในบริบทวิจัยการศึกษา',ex:['The teacher studied new pedagogy methods.','Modern pedagogy focuses more on student participation.','The reform introduced a student-centered pedagogy that shifted away from rote memorization.']},
{cat:'education',w:'academic',pos:'adj.',en:'relating to education, schools, or scholarly study',th:'ทางวิชาการ',use:'ใช้กับ performance, achievement, staff',ex:['She has strong academic results.','His academic performance improved after tutoring.','Universities increasingly measure success by academic output rather than teaching quality alone.']},
{cat:'education',w:'enrollment',pos:'n.',en:'the act of officially registering for a course or institution',th:'การลงทะเบียนเรียน',use:'ใช้กับ rate, increase, figures',ex:['Enrollment at the school grew this year.','University enrollment rates have risen steadily since 2010.','Declining birth rates are expected to reduce school enrollment figures over the next decade.']},
{cat:'education',w:'tuition',pos:'n.',en:'the fee charged for instruction, especially at a college or university',th:'ค่าเล่าเรียน',use:'ใช้กับ fees, rising, pay',ex:['Tuition fees are expensive at that college.','Many students take loans to pay tuition.','Rising tuition costs have made higher education increasingly inaccessible to low-income families.']},
{cat:'education',w:'scholarship',pos:'n.',en:'a grant of money awarded to a student because of academic or other achievement',th:'ทุนการศึกษา',use:'ใช้กับ apply for, award, win',ex:['She won a scholarship to study abroad.','He applied for a scholarship to cover his tuition.','Merit-based scholarships are often criticized for favoring students who already have access to resources.']},
{cat:'education',w:'vocational',pos:'adj.',en:'relating to the skills and knowledge needed for a particular job or trade',th:'เกี่ยวกับอาชีพ/สายอาชีพ',use:'ใช้กับ training, education, school',ex:['He chose a vocational course in cooking.','Vocational training prepares students for specific jobs.','Governments are promoting vocational education as an alternative to traditional university pathways.']},
{cat:'education',w:'cognitive',pos:'adj.',en:'relating to the mental processes of thinking, understanding, and learning',th:'เกี่ยวกับการรับรู้/กระบวนการคิด',use:'ใช้กับ development, skill, ability',ex:['Reading helps a child’s cognitive development.','Puzzles improve cognitive skills in children.','Researchers found a strong link between early bilingual education and enhanced cognitive flexibility.']},
{cat:'education',w:'comprehension',pos:'n.',en:'the ability to understand something, especially written or spoken language',th:'ความเข้าใจ (ในการอ่าน/ฟัง)',use:'ใช้กับ reading, listening, test',ex:['The test checks reading comprehension.','Her listening comprehension improved after months of practice.','Poor reading comprehension in early grades is a strong predictor of later academic struggles.']},

{cat:'academic',w:'paradox',pos:'n.',en:'a statement or situation that seems contradictory but may contain some truth',th:'ความขัดแย้งในตัวเอง/ปฏิทรรศน์',use:'ใช้กับ apparent, resolve',ex:['It seems like a paradox.','Researchers tried to resolve the paradox.','The findings present an apparent paradox: higher spending did not improve outcomes.']},
];

let currentIndex = 0;
let currentList = vocab.map((v,i)=>i);
let activeCat = 'all';
let flipped = false;

const tabsEl = document.getElementById('tabs');
const cardEl = document.getElementById('card');
const faceFront = document.getElementById('faceFront');
const faceBack = document.getElementById('faceBack');
const counterEl = document.getElementById('counter');
const metaLine = document.getElementById('metaLine');
const searchInput = document.getElementById('searchInput');

function catInfo(id){ return categories.find(c=>c.id===id); }

function buildTabs(){
  const all = document.createElement('button');
  all.className = 'tab' + (activeCat==='all' ? ' active':'');
  all.textContent = `ทั้งหมด (${vocab.length})`;
  all.style.background = '#8A8577';
  all.onclick = ()=>{ activeCat='all'; applyFilter(); };
  tabsEl.appendChild(all);
  categories.forEach(c=>{
    const count = vocab.filter(v=>v.cat===c.id).length;
    const btn = document.createElement('button');
    btn.className = 'tab' + (activeCat===c.id ? ' active':'');
    btn.textContent = `${c.name} (${count})`;
    btn.style.background = c.color;
    btn.onclick = ()=>{ activeCat=c.id; applyFilter(); };
    tabsEl.appendChild(btn);
  });
}

function applyFilter(){
  const q = searchInput.value.trim().toLowerCase();
  currentList = vocab
    .map((v,i)=>i)
    .filter(i=>{
      const v = vocab[i];
      const matchCat = activeCat==='all' || v.cat===activeCat;
      const matchSearch = !q || v.w.toLowerCase().includes(q) || v.th.includes(q);
      return matchCat && matchSearch;
    });
  currentIndex = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  Array.from(tabsEl.children).forEach((el,idx)=>{
    el.classList.remove('active');
  });
  Array.from(tabsEl.children).forEach((el)=>{
    const isAll = el.textContent.startsWith('ทั้งหมด');
    if(activeCat==='all' && isAll) el.classList.add('active');
  });
  categories.forEach((c,idx)=>{
    const el = tabsEl.children[idx+1];
    if(activeCat===c.id) el.classList.add('active');
  });
  render();
}

function render(){
  if(currentList.length===0){
    faceFront.innerHTML = '<div class="empty-state">ไม่พบคำศัพท์ที่ค้นหา</div>';
    faceBack.innerHTML = '';
    counterEl.innerHTML = '';
    metaLine.textContent = '';
    document.getElementById('prevBtn').disabled = true;
    document.getElementById('nextBtn').disabled = true;
    return;
  }
  const v = vocab[currentList[currentIndex]];
  const c = catInfo(v.cat);
  document.documentElement.style.setProperty('--accent', c.color);
  cardEl.style.setProperty('--accent', c.color);
  cardEl.style.setProperty('--accent-light', c.light);

  faceFront.innerHTML = `
    <div class="cat-chip">${c.name}</div>
    <div class="word-front">${v.w}</div>
    <div class="pos">${v.pos}</div>
    <div class="flip-hint">แตะการ์ดเพื่อดูความหมาย และตัวอย่างประโยค</div>
  `;
  faceBack.innerHTML = `
    <div class="cat-chip">${c.name}</div>
    <div class="word-back">${v.w} <span style="font-size:13px;color:var(--ink-soft);font-weight:400;font-style:italic;">${v.pos}</span></div>
    <div class="en-def"><span class="en-def-label">EN</span>${v.en}</div>
    <div class="th-meaning"><span class="th-meaning-label">TH</span>${v.th}</div>
    <div class="usage"><b>วิธีใช้:</b> ${v.use}</div>
    <div class="ex-label">ตัวอย่างประโยค (ง่าย → ซับซ้อน)</div>
    <ul class="ex-list">
      ${v.ex.map((s,i)=>`<li data-n="${i+1}">${s}</li>`).join('')}
    </ul>
  `;
  counterEl.innerHTML = `การ์ดที่ <b>${currentIndex+1}</b> จาก <b>${currentList.length}</b>`;
  metaLine.textContent = `รวมทั้งหมด ${vocab.length} คำ · 6 หมวดหมู่`;
  document.getElementById('prevBtn').disabled = currentIndex===0;
  document.getElementById('nextBtn').disabled = currentIndex===currentList.length-1;
}

cardEl.addEventListener('click', ()=>{
  if(currentList.length===0) return;
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
});

document.getElementById('prevBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  if(currentIndex>0){ currentIndex--; flipped=false; cardEl.classList.remove('flipped'); render(); }
});
document.getElementById('nextBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  if(currentIndex<currentList.length-1){ currentIndex++; flipped=false; cardEl.classList.remove('flipped'); render(); }
});
document.getElementById('shuffleBtn').addEventListener('click', ()=>{
  for(let i=currentList.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [currentList[i],currentList[j]] = [currentList[j],currentList[i]];
  }
  currentIndex = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  render();
});
searchInput.addEventListener('input', applyFilter);

document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') document.getElementById('nextBtn').click();
  if(e.key==='ArrowLeft') document.getElementById('prevBtn').click();
  if(e.key===' '){ e.preventDefault(); cardEl.click(); }
});

buildTabs();
applyFilter();
</script>
