<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Advanced Vocabulary — คำศัพท์เตรียมสอบ IELTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC;
    --paper-line:#E4DFD2;
    --ink:#2B2822;
    --ink-soft:#6B6558;
    --card-bg:#FFFDF8;
    --shadow:rgba(43,40,34,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans Thai','Inter',sans-serif;
    background:
      repeating-linear-gradient(180deg, transparent, transparent 35px, var(--paper-line) 36px),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  /* Header */
  header{margin-bottom:22px;}
  .title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(26px,5vw,34px);
    margin:0;
    letter-spacing:-0.01em;
  }
  .set-badge{
    font-size:11.5px;font-weight:700;color:#fff;background:var(--ink);
    padding:4px 10px;border-radius:20px;letter-spacing:.02em;
    transform:translateY(-2px);
  }
  .title-th{font-family:'Noto Serif Thai',serif;font-size:16px;color:var(--ink-soft);margin:4px 0 0;}
  .meta-line{font-size:13px;color:var(--ink-soft);margin-top:10px;}

  /* Search */
  .search-box{margin:18px 0 14px;position:relative;}
  .search-box input{
    width:100%;
    padding:11px 14px 11px 38px;
    border-radius:10px;
    border:1.5px solid var(--paper-line);
    background:var(--card-bg);
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  .search-box input:focus{border-color:var(--ink-soft);}
  .search-box::before{
    content:"🔍";
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    font-size:14px;opacity:.55;
  }

  /* Category tabs styled like binder index tabs */
  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:20px;
    scrollbar-width:thin;
  }
  .tab{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:8px 8px 0 0;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    border:none;
    color:#fff;
    opacity:.55;
    transition:opacity .15s ease, transform .12s ease;
    white-space:nowrap;
  }
  .tab:hover{opacity:.8;}
  .tab.active{opacity:1;transform:translateY(-2px);}

  /* Flashcard */
  .card-stage{
    perspective:1400px;
    margin-bottom:16px;
  }
  .card{
    position:relative;
    width:100%;
    min-height:340px;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    border-radius:16px;
    background:var(--card-bg);
    box-shadow:0 10px 30px var(--shadow), 0 1px 0 rgba(255,255,255,.6) inset;
    border-left:7px solid var(--accent, #6A4C93);
    padding:30px 28px;
    display:flex;
    flex-direction:column;
  }
  .face-back{transform:rotateY(180deg);overflow-y:auto;}

  .cat-chip{
    align-self:flex-start;
    font-size:11.5px;
    font-weight:700;
    color:var(--accent, #6A4C93);
    background:var(--accent-light, #EFE7F5);
    padding:3px 10px;
    border-radius:20px;
    margin-bottom:16px;
    letter-spacing:.02em;
  }
  .word-front{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(32px,7vw,44px);
    line-height:1.1;
    margin:0 0 8px;
  }
  .pos{font-size:14px;color:var(--ink-soft);font-style:italic;margin-bottom:auto;}
  .flip-hint{
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed var(--paper-line);
  }

  .word-back{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin:0 0 4px;
  }
  .en-def{
    font-size:14px;
    color:var(--ink);
    margin:0 0 10px;
    line-height:1.6;
    padding-left:1px;
  }
  .en-def-label{
    font-size:10.5px;font-weight:700;letter-spacing:.04em;
    color:var(--accent,#6A4C93);margin-right:6px;
  }
  .th-meaning{
    font-family:'Noto Serif Thai',serif;
    font-size:16px;
    color:var(--ink);
    margin:0 0 14px;
    line-height:1.55;
  }
  .th-meaning-label{
    font-size:10.5px;font-weight:700;letter-spacing:.04em;
    font-family:'Noto Sans Thai',sans-serif;
    color:var(--accent,#6A4C93);margin-right:6px;
  }
  .usage{
    font-size:13.5px;
    color:var(--ink-soft);
    background:var(--paper);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:16px;
    line-height:1.6;
  }
  .usage b{color:var(--ink);}
  .ex-label{font-size:12px;font-weight:700;color:var(--accent,#6A4C93);letter-spacing:.03em;margin-bottom:8px;}
  .ex-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .ex-list li{
    font-size:14px;
    line-height:1.55;
    padding-left:22px;
    position:relative;
  }
  .ex-list li::before{
    content:attr(data-n);
    position:absolute;left:0;top:1px;
    font-size:11px;font-weight:700;
    color:#fff;background:var(--accent,#6A4C93);
    width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .ex-list mark{
    background:var(--accent-light,#EFE7F5);
    color:var(--accent,#6A4C93);
    padding:0 3px;
    border-radius:3px;
    font-weight:600;
  }

  /* Controls */
  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:18px;
  }
  .nav-btn{
    background:var(--card-bg);
    border:1.5px solid var(--paper-line);
    border-radius:10px;
    width:44px;height:44px;
    font-size:18px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease;
    flex:0 0 auto;
  }
  .nav-btn:hover{background:var(--paper);}
  .nav-btn:disabled{opacity:.35;cursor:default;}
  .counter{
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    flex:1;
  }
  .counter b{color:var(--ink);}
  .shuffle-btn{
    background:var(--card-bg);
    border:1.5px solid var(--paper-line);
    border-radius:10px;
    padding:0 16px;height:44px;
    font-size:13px;font-weight:600;
    font-family:inherit;
    cursor:pointer;
    color:var(--ink);
    display:flex;align-items:center;gap:6px;
    flex:0 0 auto;
  }
  .shuffle-btn:hover{background:var(--paper);}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:14px;
  }

  @media (max-width:480px){
    .face{padding:24px 20px;}
    .controls{flex-wrap:wrap;}
    .counter{order:3;width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-row">
      <h1>IELTS Advanced Vocabulary</h1>
      <span class="set-badge">ชุดที่ 2</span>
    </div>
    <p class="title-th">คำศัพท์ขั้นสูง 150 คำ แบ่งตามหัวข้อ พร้อมคำจำกัดความภาษาอังกฤษ ความหมายไทย วิธีใช้ และตัวอย่างประโยค 3 ระดับ</p>
    <p class="meta-line" id="metaLine"></p>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="ค้นหาคำศัพท์ หรือ พิมพ์คำแปลไทย...">
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="card-stage">
    <div class="card" id="card">
      <div class="face face-front" id="faceFront"></div>
      <div class="face face-back" id="faceBack"></div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" title="คำก่อนหน้า">←</button>
    <div class="counter" id="counter"></div>
    <button class="nav-btn" id="nextBtn" title="คำถัดไป">→</button>
  </div>
  <div class="controls" style="margin-top:10px;justify-content:center;">
    <button class="shuffle-btn" id="shuffleBtn">🔀 สุ่มลำดับ</button>
  </div>
</div>

<script>
const categories = [
  {id:'crime', name:'อาชญากรรม-กฎหมาย', color:'#47536B', light:'#E6E9EE'},
  {id:'media', name:'สื่อ-การสื่อสาร', color:'#B5502F', light:'#F5E3DA'},
  {id:'culture', name:'วัฒนธรรม-สังคม', color:'#6E7B3A', light:'#E9EDDD'},
  {id:'science', name:'วิทยาศาสตร์-วิจัย', color:'#33507A', light:'#E1E7F0'},
  {id:'work', name:'การทำงาน-อาชีพ', color:'#8C6A2F', light:'#F1E9D9'},
  {id:'politics', name:'การเมือง-การปกครอง', color:'#7A3B54', light:'#F0E1E8'},
];

const vocab = [

// ============ CRIME & LAW (25) ============
{cat:'crime',w:'offence',pos:'n.',en:'an illegal act; a crime',th:'ความผิด/การกระทำผิดกฎหมาย',use:'ใช้กับ commit, criminal, minor',ex:['Stealing is a criminal offence.','He was charged with a minor traffic offence.','Repeat offenders often receive harsher sentences than those who commit a first offence.']},
{cat:'crime',w:'felony',pos:'n.',en:'a serious crime, typically one involving violence',th:'ความผิดอาญาร้ายแรง',use:'ตรงข้ามกับ misdemeanor',ex:['Robbery is considered a felony.','He was convicted of a felony and sent to prison.','In many legal systems, a felony conviction can permanently affect a person’s civil rights.']},
{cat:'crime',w:'misdemeanor',pos:'n.',en:'a minor wrongdoing or crime, less serious than a felony',th:'ความผิดลหุโทษ',use:'ตรงข้ามกับ felony',ex:['Jaywalking is usually a misdemeanor.','She received a fine for a minor misdemeanor.','Unlike a felony, a misdemeanor rarely results in a lengthy prison sentence.']},
{cat:'crime',w:'verdict',pos:'n.',en:'a decision on a disputed issue in a legal case',th:'คำตัดสินของคณะลูกขุน/ศาล',use:'ใช้กับ reach, deliver, guilty/not guilty',ex:['The jury reached a verdict.','The court delivered its verdict after three days.','The jury’s verdict surprised many observers who had expected a conviction.']},
{cat:'crime',w:'testimony',pos:'n.',en:'a formal statement given as evidence in a court of law',th:'คำให้การ (ในชั้นศาล)',use:'ใช้กับ give, provide, witness',ex:['The witness gave testimony in court.','Her testimony helped convict the suspect.','Conflicting testimony from the two witnesses made the case difficult to resolve.']},
{cat:'crime',w:'litigation',pos:'n.',en:'the process of taking legal action in court',th:'การดำเนินคดีทางกฎหมาย',use:'ใช้กับ engage in, avoid, costly',ex:['The company faced litigation.','They settled to avoid costly litigation.','Prolonged litigation can drain a small business’s finances long before a verdict is reached.']},
{cat:'crime',w:'prosecute',pos:'v.',en:'to bring criminal charges against someone in court',th:'ฟ้องร้องดำเนินคดี',use:'ใช้กับ decide to, fail to',ex:['Police decided to prosecute the driver.','The state chose to prosecute the case fully.','Prosecutors often struggle to prosecute cybercrime due to a lack of physical evidence.']},
{cat:'crime',w:'defendant',pos:'n.',en:'a person accused of a crime in a court of law',th:'จำเลย',use:'ตรงข้ามกับ plaintiff',ex:['The defendant pleaded not guilty.','The judge addressed the defendant directly.','The defendant’s lawyer argued that the evidence had been collected unlawfully.']},
{cat:'crime',w:'plaintiff',pos:'n.',en:'a person who brings a case against another in a court of law',th:'โจทก์',use:'ตรงข้ามกับ defendant',ex:['The plaintiff filed a lawsuit.','The plaintiff sought compensation for damages.','The plaintiff’s legal team presented documents proving the breach of contract.']},
{cat:'crime',w:'acquit',pos:'v.',en:'to declare someone not guilty of a criminal charge',th:'ตัดสินให้พ้นผิด',use:'มักใช้ passive: be acquitted',ex:['The jury acquitted him.','She was acquitted of all charges.','Despite strong suspicion, the defendant was ultimately acquitted due to insufficient evidence.']},
{cat:'crime',w:'convict',pos:'v./n.',en:'to declare someone guilty of a crime (v.); a person found guilty of a crime (n.)',th:'ตัดสินว่ามีความผิด / นักโทษ',use:'ใช้เป็นทั้งกริยาและนาม',ex:['The court convicted him of fraud.','He is now a convicted criminal.','Studies show that a significant number of convicts reoffend within five years of release.']},
{cat:'crime',w:'custody',pos:'n.',en:'the state of being detained by police, or legal responsibility for caring for a child',th:'การควบคุมตัว/สิทธิ์ปกครองบุตร',use:'ใช้กับ police, in custody, child custody',ex:['He was taken into custody.','The couple disputed child custody.','The suspect remained in custody while investigators gathered further evidence.']},
{cat:'crime',w:'bail',pos:'n.',en:'money paid to allow a person to be released from custody until trial',th:'การประกันตัว',use:'ใช้กับ post, grant, deny',ex:['He was released on bail.','The judge denied bail.','The court granted bail on the condition that the suspect surrender his passport.']},
{cat:'crime',w:'juvenile',pos:'adj./n.',en:'relating to young people who are not yet adults, or a young offender',th:'เยาวชน',use:'ใช้กับ juvenile court, offender',ex:['He was tried in juvenile court.','Juvenile crime rates have fallen.','The reform aims to rehabilitate juvenile offenders rather than simply punish them.']},
{cat:'crime',w:'deterrent',pos:'n.',en:'something that discourages a person from doing something, often through fear of consequences',th:'สิ่งที่ใช้ยับยั้งการกระทำผิด',use:'ใช้กับ act as, serve as',ex:['Fines act as a deterrent.','Harsh penalties serve as a deterrent to crime.','Criminologists debate whether the death penalty is truly an effective deterrent.']},
{cat:'crime',w:'recidivism',pos:'n.',en:'the tendency of a convicted criminal to reoffend',th:'การกระทำผิดซ้ำ',use:'ใช้กับ rate, reduce',ex:['Recidivism is a serious problem.','The program aims to reduce recidivism.','Education programs in prison have been shown to significantly lower rates of recidivism.']},
{cat:'crime',w:'forensic',pos:'adj.',en:'relating to scientific methods used to investigate crime',th:'ทางนิติวิทยาศาสตร์',use:'ใช้กับ evidence, analysis, expert',ex:['Forensic experts examined the scene.','Forensic evidence linked him to the crime.','Advances in forensic analysis have helped solve cases that were unsolved for decades.']},
{cat:'crime',w:'legislation',pos:'n.',en:'laws considered collectively, or the process of making laws',th:'กฎหมาย/กระบวนการออกกฎหมาย',use:'ใช้กับ pass, introduce, draft',ex:['Parliament passed new legislation.','The government introduced tougher legislation.','Lawmakers drafted legislation aimed at closing loopholes in existing regulations.']},
{cat:'crime',w:'legitimate',pos:'adj.',en:'conforming to the law or to accepted standards',th:'ถูกต้องตามกฎหมาย/ชอบธรรม',use:'ใช้กับ business, claim, reason',ex:['He runs a legitimate business.','She had a legitimate reason for being late.','The company insisted its practices were entirely legitimate despite public criticism.']},
{cat:'crime',w:'infringe',pos:'v.',en:'to violate someone’s rights or break a rule or law',th:'ละเมิด (สิทธิ/กฎหมาย)',use:'ใช้กับ right, copyright, on',ex:['The rule infringes on privacy.','The company infringed his copyright.','Critics argue the new surveillance law infringes on basic civil liberties.']},
{cat:'crime',w:'breach',pos:'n./v.',en:'an act of breaking a law, agreement, or code of conduct',th:'การละเมิด',use:'ใช้กับ contract, security, of',ex:['It was a breach of contract.','The company suffered a data breach.','The leak represented a serious breach of national security protocols.']},
{cat:'crime',w:'liability',pos:'n.',en:'the state of being legally responsible for something',th:'ความรับผิดชอบตามกฎหมาย',use:'ใช้กับ legal, accept, limit',ex:['The driver accepted liability.','The company faces legal liability.','Insurance policies are designed to limit an individual’s financial liability in an accident.']},
{cat:'crime',w:'jurisdiction',pos:'n.',en:'the official power to make legal decisions within a particular area',th:'เขตอำนาจศาล',use:'ใช้กับ fall under, outside',ex:['This case falls under local jurisdiction.','The matter is outside our jurisdiction.','Cross-border crimes often raise difficult questions about which country’s jurisdiction applies.']},
{cat:'crime',w:'compliance',pos:'n.',en:'the act of obeying a rule, law, or request',th:'การปฏิบัติตามกฎ/ข้อบังคับ',use:'ใช้กับ ensure, in compliance with',ex:['The factory ensures safety compliance.','All staff must act in compliance with the law.','Regulators conducted an audit to verify the bank’s compliance with financial reporting rules.']},
{cat:'crime',w:'perpetrator',pos:'n.',en:'a person who carries out a harmful, illegal, or immoral act',th:'ผู้กระทำความผิด',use:'ใช้กับ identify, bring to justice',ex:['Police identified the perpetrator.','The perpetrator was brought to justice.','Investigators used forensic evidence to trace the perpetrator of the cyberattack.']},

// ============ MEDIA & COMMUNICATION (25) ============
{cat:'media',w:'broadcast',pos:'v./n.',en:'to transmit a program on television or radio; a televised or radio program',th:'การออกอากาศ',use:'ใช้เป็นทั้งกริยาและนาม',ex:['The match was broadcast live.','She watched the evening broadcast.','The network decided to broadcast the debate to millions of viewers nationwide.']},
{cat:'media',w:'censorship',pos:'n.',en:'the suppression of speech or information considered harmful or objectionable',th:'การเซ็นเซอร์/ตรวจสอบและควบคุมเนื้อหา',use:'ใช้กับ strict, impose, government',ex:['Some countries have strict censorship.','The government imposed censorship on the press.','Critics argue that online censorship threatens freedom of expression.']},
{cat:'media',w:'propaganda',pos:'n.',en:'biased information used to promote a political cause or point of view',th:'โฆษณาชวนเชื่อ',use:'ใช้กับ spread, political',ex:['The regime spread propaganda.','Political propaganda filled the newspapers.','Historians have studied how wartime propaganda shaped public opinion for decades.']},
{cat:'media',w:'bias',pos:'n.',en:'a tendency to favor one side unfairly',th:'อคติ/ความลำเอียง',use:'ใช้กับ media, political, show',ex:['The report showed media bias.','Readers accused the paper of political bias.','Algorithms can unintentionally reinforce bias by showing users only content they already agree with.']},
{cat:'media',w:'objectivity',pos:'n.',en:'the quality of being based on facts rather than personal feelings',th:'ความเป็นกลาง (ไม่มีอคติ)',use:'ใช้กับ maintain, journalistic',ex:['Journalists strive for objectivity.','The editor questioned the report’s objectivity.','Maintaining objectivity becomes difficult when journalists report on issues that affect them personally.']},
{cat:'media',w:'credibility',pos:'n.',en:'the quality of being trusted and believed',th:'ความน่าเชื่อถือ',use:'ใช้กับ lose, gain, question',ex:['The source lacked credibility.','The scandal damaged his credibility.','Repeated factual errors have seriously undermined the news outlet’s credibility.']},
{cat:'media',w:'misinformation',pos:'n.',en:'false or inaccurate information that is spread, regardless of intent',th:'ข้อมูลที่ผิดพลาด (ไม่จำเป็นต้องตั้งใจ)',use:'ใช้กับ spread, combat, online',ex:['Misinformation spread online quickly.','The site tries to combat misinformation.','Health misinformation during the outbreak made it harder for officials to communicate accurate guidance.']},
{cat:'media',w:'defamation',pos:'n.',en:'the act of damaging someone’s reputation through false statements',th:'การหมิ่นประมาท',use:'ใช้กับ sue for, commit',ex:['He sued the newspaper for defamation.','The comment was considered defamation.','Public figures often find it harder to win defamation cases than private individuals.']},
{cat:'media',w:'journalism',pos:'n.',en:'the activity of collecting and reporting news',th:'วารสารศาสตร์/งานสื่อสารมวลชน',use:'ใช้กับ investigative, career in',ex:['She studied journalism at university.','Investigative journalism exposed the scandal.','Quality journalism depends on reporters verifying facts before a story is published.']},
{cat:'media',w:'tabloid',pos:'n./adj.',en:'a newspaper with small pages that often features sensational stories',th:'หนังสือพิมพ์แนวเน้นข่าวฉาว',use:'ใช้กับ tabloid press, headline',ex:['He read a tabloid at the station.','The tabloid press loves celebrity gossip.','The story was picked up by several tabloids before serious outlets confirmed the facts.']},
{cat:'media',w:'outlet',pos:'n.',en:'an organization that provides news or information to the public',th:'สำนักข่าว/ช่องทางสื่อ',use:'ใช้กับ media, news, reputable',ex:['The story appeared in a major outlet.','She works for a news outlet.','Several reputable outlets independently confirmed the details before publishing the report.']},
{cat:'media',w:'headline',pos:'n.',en:'the title printed in large letters above a newspaper article',th:'พาดหัวข่าว',use:'ใช้กับ catch, make, misleading',ex:['The headline caught my eye.','She made headlines with her speech.','A misleading headline can shape public perception even if the article itself is accurate.']},
{cat:'media',w:'viral',pos:'adj.',en:'spreading quickly and widely among many people, especially online',th:'แพร่กระจายอย่างรวดเร็ว (บนโลกออนไลน์)',use:'ใช้กับ go viral, video',ex:['The video went viral overnight.','Her post became viral within hours.','Companies now design advertisements specifically hoping they will go viral on social media.']},

// ============ CULTURE & SOCIETY (25) ============

{cat:'culture',w:'assimilation',pos:'n.',en:'the process of adapting to and adopting the culture of a group',th:'การกลืนกลายทางวัฒนธรรม',use:'ใช้กับ cultural, process of',ex:['Assimilation was difficult for the family.','The policy encouraged cultural assimilation.','Forced assimilation policies often caused communities to lose their native language over time.']},

// ============ SCIENCE & RESEARCH (25) ============

{cat:'science',w:'inference',pos:'n.',en:'a conclusion reached on the basis of evidence and reasoning',th:'การอนุมาน/การสรุปจากหลักฐาน',use:'ใช้กับ draw, statistical',ex:['We can draw an inference from the data.','Statistical inference guided the conclusion.','Careful statistical inference allowed researchers to draw conclusions from a relatively small sample.']},

{cat:'science',w:'pioneering',pos:'adj.',en:'introducing new methods or ideas for the first time',th:'บุกเบิก',use:'ใช้กับ work, research, study',ex:['Her pioneering work changed the field.','They conducted pioneering research.','This pioneering study laid the foundation for decades of subsequent medical research.']},

let currentIndex = 0;
let currentList = vocab.map((v,i)=>i);
let activeCat = 'all';
let flipped = false;

const tabsEl = document.getElementById('tabs');
const cardEl = document.getElementById('card');
const faceFront = document.getElementById('faceFront');
const faceBack = document.getElementById('faceBack');
const counterEl = document.getElementById('counter');
const metaLine = document.getElementById('metaLine');
const searchInput = document.getElementById('searchInput');

function catInfo(id){ return categories.find(c=>c.id===id); }

function buildTabs(){
  const all = document.createElement('button');
  all.className = 'tab' + (activeCat==='all' ? ' active':'');
  all.textContent = `ทั้งหมด (${vocab.length})`;
  all.style.background = '#8A8577';
  all.onclick = ()=>{ activeCat='all'; applyFilter(); };
  tabsEl.appendChild(all);
  categories.forEach(c=>{
    const count = vocab.filter(v=>v.cat===c.id).length;
    const btn = document.createElement('button');
    btn.className = 'tab' + (activeCat===c.id ? ' active':'');
    btn.textContent = `${c.name} (${count})`;
    btn.style.background = c.color;
    btn.onclick = ()=>{ activeCat=c.id; applyFilter(); };
    tabsEl.appendChild(btn);
  });
}

function applyFilter(){
  const q = searchInput.value.trim().toLowerCase();
  currentList = vocab
    .map((v,i)=>i)
    .filter(i=>{
      const v = vocab[i];
      const matchCat = activeCat==='all' || v.cat===activeCat;
      const matchSearch = !q || v.w.toLowerCase().includes(q) || v.th.includes(q);
      return matchCat && matchSearch;
    });
  currentIndex = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  Array.from(tabsEl.children).forEach((el,idx)=>{
    el.classList.remove('active');
  });
  Array.from(tabsEl.children).forEach((el)=>{
    const isAll = el.textContent.startsWith('ทั้งหมด');
    if(activeCat==='all' && isAll) el.classList.add('active');
  });
  categories.forEach((c,idx)=>{
    const el = tabsEl.children[idx+1];
    if(activeCat===c.id) el.classList.add('active');
  });
  render();
}

function render(){
  if(currentList.length===0){
    faceFront.innerHTML = '<div class="empty-state">ไม่พบคำศัพท์ที่ค้นหา</div>';
    faceBack.innerHTML = '';
    counterEl.innerHTML = '';
    metaLine.textContent = '';
    document.getElementById('prevBtn').disabled = true;
    document.getElementById('nextBtn').disabled = true;
    return;
  }
  const v = vocab[currentList[currentIndex]];
  const c = catInfo(v.cat);
  document.documentElement.style.setProperty('--accent', c.color);
  cardEl.style.setProperty('--accent', c.color);
  cardEl.style.setProperty('--accent-light', c.light);

  faceFront.innerHTML = `
    <div class="cat-chip">${c.name}</div>
    <div class="word-front">${v.w}</div>
    <div class="pos">${v.pos}</div>
    <div class="flip-hint">แตะการ์ดเพื่อดูความหมาย และตัวอย่างประโยค</div>
  `;
  faceBack.innerHTML = `
    <div class="cat-chip">${c.name}</div>
    <div class="word-back">${v.w} <span style="font-size:13px;color:var(--ink-soft);font-weight:400;font-style:italic;">${v.pos}</span></div>
    <div class="en-def"><span class="en-def-label">EN</span>${v.en}</div>
    <div class="th-meaning"><span class="th-meaning-label">TH</span>${v.th}</div>
    <div class="usage"><b>วิธีใช้:</b> ${v.use}</div>
    <div class="ex-label">ตัวอย่างประโยค (ง่าย → ซับซ้อน)</div>
    <ul class="ex-list">
      ${v.ex.map((s,i)=>`<li data-n="${i+1}">${s}</li>`).join('')}
    </ul>
  `;
  counterEl.innerHTML = `การ์ดที่ <b>${currentIndex+1}</b> จาก <b>${currentList.length}</b>`;
  metaLine.textContent = `รวมทั้งหมด ${vocab.length} คำ · 6 หมวดหมู่`;
  document.getElementById('prevBtn').disabled = currentIndex===0;
  document.getElementById('nextBtn').disabled = currentIndex===currentList.length-1;
}

cardEl.addEventListener('click', ()=>{
  if(currentList.length===0) return;
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
});

document.getElementById('prevBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  if(currentIndex>0){ currentIndex--; flipped=false; cardEl.classList.remove('flipped'); render(); }
});
document.getElementById('nextBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  if(currentIndex<currentList.length-1){ currentIndex++; flipped=false; cardEl.classList.remove('flipped'); render(); }
});
document.getElementById('shuffleBtn').addEventListener('click', ()=>{
  for(let i=currentList.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [currentList[i],currentList[j]] = [currentList[j],currentList[i]];
  }
  currentIndex = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  render();
});
searchInput.addEventListener('input', applyFilter);

document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') document.getElementById('nextBtn').click();
  if(e.key==='ArrowLeft') document.getElementById('prevBtn').click();
  if(e.key===' '){ e.preventDefault(); cardEl.click(); }
});

buildTabs();
applyFilter();
</script>
