<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Advanced Vocabulary — คำศัพท์เตรียมสอบ IELTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC;
    --paper-line:#E4DFD2;
    --ink:#2B2822;
    --ink-soft:#6B6558;
    --card-bg:#FFFDF8;
    --shadow:rgba(43,40,34,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans Thai','Inter',sans-serif;
    background:
      repeating-linear-gradient(180deg, transparent, transparent 35px, var(--paper-line) 36px),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  /* Header */
  header{margin-bottom:22px;}
  .title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(26px,5vw,34px);
    margin:0;
    letter-spacing:-0.01em;
  }
  .set-badge{
    font-size:11.5px;font-weight:700;color:#fff;background:var(--ink);
    padding:4px 10px;border-radius:20px;letter-spacing:.02em;
    transform:translateY(-2px);
  }
  .title-th{font-family:'Noto Serif Thai',serif;font-size:16px;color:var(--ink-soft);margin:4px 0 0;}
  .meta-line{font-size:13px;color:var(--ink-soft);margin-top:10px;}

  /* Search */
  .search-box{margin:18px 0 14px;position:relative;}
  .search-box input{
    width:100%;
    padding:11px 14px 11px 38px;
    border-radius:10px;
    border:1.5px solid var(--paper-line);
    background:var(--card-bg);
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  .search-box input:focus{border-color:var(--ink-soft);}
  .search-box::before{
    content:"🔍";
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    font-size:14px;opacity:.55;
  }

  /* Category tabs styled like binder index tabs */
  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:20px;
    scrollbar-width:thin;
  }
  .tab{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:8px 8px 0 0;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    border:none;
    color:#fff;
    opacity:.55;
    transition:opacity .15s ease, transform .12s ease;
    white-space:nowrap;
  }
  .tab:hover{opacity:.8;}
  .tab.active{opacity:1;transform:translateY(-2px);}

  /* Flashcard */
  .card-stage{
    perspective:1400px;
    margin-bottom:16px;
  }
  .card{
    position:relative;
    width:100%;
    min-height:340px;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    border-radius:16px;
    background:var(--card-bg);
    box-shadow:0 10px 30px var(--shadow), 0 1px 0 rgba(255,255,255,.6) inset;
    border-left:7px solid var(--accent, #6A4C93);
    padding:30px 28px;
    display:flex;
    flex-direction:column;
  }
  .face-back{transform:rotateY(180deg);overflow-y:auto;}

  .cat-chip{
    align-self:flex-start;
    font-size:11.5px;
    font-weight:700;
    color:var(--accent, #6A4C93);
    background:var(--accent-light, #EFE7F5);
    padding:3px 10px;
    border-radius:20px;
    margin-bottom:16px;
    letter-spacing:.02em;
  }
  .word-front{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(32px,7vw,44px);
    line-height:1.1;
    margin:0 0 8px;
  }
  .pos{font-size:14px;color:var(--ink-soft);font-style:italic;margin-bottom:auto;}
  .flip-hint{
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed var(--paper-line);
  }

  .word-back{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin:0 0 4px;
  }
  .en-def{
    font-size:14px;
    color:var(--ink);
    margin:0 0 10px;
    line-height:1.6;
    padding-left:1px;
  }
  .en-def-label{
    font-size:10.5px;font-weight:700;letter-spacing:.04em;
    color:var(--accent,#6A4C93);margin-right:6px;
  }
  .th-meaning{
    font-family:'Noto Serif Thai',serif;
    font-size:16px;
    color:var(--ink);
    margin:0 0 14px;
    line-height:1.55;
  }
  .th-meaning-label{
    font-size:10.5px;font-weight:700;letter-spacing:.04em;
    font-family:'Noto Sans Thai',sans-serif;
    color:var(--accent,#6A4C93);margin-right:6px;
  }
  .usage{
    font-size:13.5px;
    color:var(--ink-soft);
    background:var(--paper);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:16px;
    line-height:1.6;
  }
  .usage b{color:var(--ink);}
  .ex-label{font-size:12px;font-weight:700;color:var(--accent,#6A4C93);letter-spacing:.03em;margin-bottom:8px;}
  .ex-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .ex-list li{
    font-size:14px;
    line-height:1.55;
    padding-left:22px;
    position:relative;
  }
  .ex-list li::before{
    content:attr(data-n);
    position:absolute;left:0;top:1px;
    font-size:11px;font-weight:700;
    color:#fff;background:var(--accent,#6A4C93);
    width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .ex-list mark{
    background:var(--accent-light,#EFE7F5);
    color:var(--accent,#6A4C93);
    padding:0 3px;
    border-radius:3px;
    font-weight:600;
  }

  /* Controls */
  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:18px;
  }
  .nav-btn{
    background:var(--card-bg);
    border:1.5px solid var(--paper-line);
    border-radius:10px;
    width:44px;height:44px;
    font-size:18px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease;
    flex:0 0 auto;
  }
  .nav-btn:hover{background:var(--paper);}
  .nav-btn:disabled{opacity:.35;cursor:default;}
  .counter{
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    flex:1;
  }
  .counter b{color:var(--ink);}
  .shuffle-btn{
    background:var(--card-bg);
    border:1.5px solid var(--paper-line);
    border-radius:10px;
    padding:0 16px;height:44px;
    font-size:13px;font-weight:600;
    font-family:inherit;
    cursor:pointer;
    color:var(--ink);
    display:flex;align-items:center;gap:6px;
    flex:0 0 auto;
  }
  .shuffle-btn:hover{background:var(--paper);}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:14px;
  }

  @media (max-width:480px){
    .face{padding:24px 20px;}
    .controls{flex-wrap:wrap;}
    .counter{order:3;width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-row">
      <h1>IELTS Advanced Vocabulary</h1>
      <span class="set-badge">ชุดที่ 6</span>
    </div>
    <p class="title-th">คำศัพท์ขั้นสูง 150 คำ แบ่งตามหัวข้อ พร้อมคำจำกัดความภาษาอังกฤษ ความหมายไทย วิธีใช้ และตัวอย่างประโยค 3 ระดับ</p>
    <p class="meta-line" id="metaLine"></p>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="ค้นหาคำศัพท์ หรือ พิมพ์คำแปลไทย...">
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="card-stage">
    <div class="card" id="card">
      <div class="face face-front" id="faceFront"></div>
      <div class="face face-back" id="faceBack"></div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" title="คำก่อนหน้า">←</button>
    <div class="counter" id="counter"></div>
    <button class="nav-btn" id="nextBtn" title="คำถัดไป">→</button>
  </div>
  <div class="controls" style="margin-top:10px;justify-content:center;">
    <button class="shuffle-btn" id="shuffleBtn">🔀 สุ่มลำดับ</button>
  </div>
</div>

<script>
const categories = [
  {id:'law', name:'กฎหมาย-กระบวนการยุติธรรม', color:'#33574A', light:'#DEE7E2'},
  {id:'religion', name:'ศาสนา-ความเชื่อ', color:'#6B5040', light:'#EAE1D9'},
  {id:'gender', name:'เพศสภาพ-บทบาททางสังคม', color:'#7A3F6B', light:'#EDE0E8'},
  {id:'innovation', name:'นวัตกรรม-เทคโนโลยีอนาคต', color:'#1F6F8B', light:'#DCEBF0'},
  {id:'finance', name:'การเงินส่วนบุคคล', color:'#3C8C5C', light:'#DEEFE2'},
  {id:'international', name:'ความสัมพันธ์ระหว่างประเทศ-การทูต', color:'#4A5C7A', light:'#E2E6EC'},
];

const vocab = [

// ============ LAW & JUSTICE SYSTEM (25) ============
{cat:'law',w:'judiciary',pos:'n.',en:'the branch of government responsible for interpreting and applying the law',th:'ฝ่ายตุลาการ',use:'ใช้กับ independent, branch of',ex:['The judiciary interprets the law.','An independent judiciary is essential.','A truly independent judiciary helps ensure that no one is above the law.']},
{cat:'law',w:'constitution',pos:'n.',en:'the fundamental set of principles by which a country or organization is governed',th:'รัฐธรรมนูญ',use:'ใช้กับ amend, uphold',ex:['The constitution protects citizens’ rights.','Lawmakers voted to amend the constitution.','Judges are responsible for interpreting and upholding the constitution.']},
{cat:'law',w:'constitutional',pos:'adj.',en:'relating to or consistent with a constitution',th:'เกี่ยวกับรัฐธรรมนูญ',use:'ใช้กับ right, reform',ex:['Free speech is a constitutional right.','They proposed constitutional reform.','The court ruled the law unconstitutional and struck it down entirely.']},
{cat:'law',w:'statute',pos:'n.',en:'a written law passed by a legislative body',th:'บทบัญญัติ/กฎหมายลายลักษณ์อักษร',use:'ใช้กับ pass, violate',ex:['Parliament passed a new statute.','The company violated the statute.','The statute clearly outlines the penalties for repeated violations.']},
{cat:'law',w:'precedent',pos:'n.',en:'a previous legal case used as a guide for deciding similar future cases',th:'บรรทัดฐานทางกฎหมาย',use:'ใช้กับ set, establish',ex:['The ruling set a legal precedent.','Judges rely on precedent.','This landmark case established a precedent that courts still follow today.']},
{cat:'law',w:'appeal',pos:'n./v.',en:'to formally request that a higher court review a legal decision',th:'การอุทธรณ์',use:'ใช้กับ file, court of',ex:['He filed an appeal.','The case went to the court of appeal.','Her lawyer appealed the verdict, arguing that key evidence had been overlooked.']},
{cat:'law',w:'tribunal',pos:'n.',en:'a body established to settle certain types of disputes, often outside the regular court system',th:'ศาลพิเศษ/คณะกรรมการตัดสินคดี',use:'ใช้กับ international, hearing',ex:['The case went to a tribunal.','An international tribunal heard the case.','Employees can bring workplace disputes before an employment tribunal.']},
{cat:'law',w:'arbitration',pos:'n.',en:'a process of resolving a dispute using an independent third party instead of going to court',th:'อนุญาโตตุลาการ',use:'ใช้กับ resolve through, binding',ex:['They resolved the dispute through arbitration.','The contract requires binding arbitration.','Arbitration is often faster and less expensive than a full court trial.']},
{cat:'law',w:'mediation',pos:'n.',en:'a process in which a neutral third party helps two sides reach an agreement',th:'การไกล่เกลี่ย',use:'ใช้กับ seek, family',ex:['They sought mediation instead of court.','Family mediation helped resolve the dispute.','Mediation allows both parties to reach a compromise without a lengthy trial.']},
{cat:'law',w:'due process',pos:'phrase',en:'the legal requirement that the state respect all legal rights owed to a person',th:'กระบวนการที่ถูกต้องตามกฎหมาย',use:'ใช้กับ right to, guarantee',ex:['Everyone has a right to due process.','The trial followed due process.','Due process ensures that no one is punished without a fair legal procedure.']},
{cat:'law',w:'injunction',pos:'n.',en:'a court order requiring a person or organization to do or stop doing something',th:'คำสั่งห้ามชั่วคราวของศาล',use:'ใช้กับ seek, issue',ex:['The court issued an injunction.','They sought an injunction to stop construction.','A judge granted a temporary injunction preventing the company from proceeding.']},
{cat:'law',w:'plea bargain',pos:'phrase',en:'an agreement in which a defendant pleads guilty to a lesser charge in exchange for a lighter sentence',th:'การต่อรองคำรับสารภาพ',use:'ใช้กับ accept, offer',ex:['He accepted a plea bargain.','Prosecutors offered a plea bargain.','A plea bargain allowed the trial to conclude without a lengthy jury process.']},
{cat:'law',w:'indictment',pos:'n.',en:'a formal accusation charging someone with a serious crime',th:'คำฟ้อง/การตั้งข้อกล่าวหาอย่างเป็นทางการ',use:'ใช้กับ issue, face',ex:['A grand jury issued an indictment.','He faced a criminal indictment.','The indictment listed several serious charges against the former executive.']},
{cat:'law',w:'subpoena',pos:'n.',en:'a legal document ordering a person to appear in court or provide evidence',th:'หมายเรียก (พยาน/เอกสาร)',use:'ใช้กับ issue, comply with',ex:['The court issued a subpoena.','She was ordered to comply with the subpoena.','Investigators used a subpoena to obtain the company’s internal records.']},
{cat:'law',w:'affidavit',pos:'n.',en:'a written statement made under oath, used as evidence in court',th:'คำให้การเป็นลายลักษณ์อักษร',use:'ใช้กับ sign, submit',ex:['He signed a sworn affidavit.','She submitted an affidavit to the court.','The witness’s affidavit provided crucial evidence supporting the case.']},
{cat:'law',w:'civil law',pos:'phrase',en:'the branch of law dealing with disputes between individuals or organizations, rather than crimes',th:'กฎหมายแพ่ง',use:'ตรงข้ามกับ criminal law',ex:['The dispute was settled under civil law.','Civil law covers contracts and property.','Civil law cases typically involve compensation rather than criminal punishment.']},
{cat:'law',w:'criminal justice',pos:'phrase',en:'the system of practices and institutions used to deal with crime and criminal behavior',th:'กระบวนการยุติธรรมทางอาญา',use:'ใช้กับ system, reform',ex:['The criminal justice system needs reform.','She studies criminal justice.','Reforming the criminal justice system remains a major political priority.']},
{cat:'law',w:'rule of law',pos:'phrase',en:'the principle that everyone, including the government, is subject to and accountable under the law',th:'หลักนิติธรรม',use:'ใช้กับ uphold, undermine',ex:['The country upholds the rule of law.','Corruption undermines the rule of law.','A strong rule of law protects citizens from arbitrary government power.']},
{cat:'law',w:'impartial',pos:'adj.',en:'treating all sides fairly, without favoritism',th:'เป็นกลาง/ปราศจากอคติ',use:'ใช้กับ judge, remain',ex:['The judge remained impartial.','Jurors must be impartial.','An impartial investigation is essential for the public to trust the outcome.']},
{cat:'law',w:'presumption of innocence',pos:'phrase',en:'the legal principle that a person is considered innocent until proven guilty',th:'หลักสันนิษฐานว่าเป็นผู้บริสุทธิ์',use:'ใช้กับ uphold, right to',ex:['Courts uphold the presumption of innocence.','He has the right to presumption of innocence.','The presumption of innocence is a cornerstone of fair criminal trials.']},
{cat:'law',w:'cross-examine',pos:'v.',en:'to question a witness called by the opposing side in a trial',th:'ซักถามค้าน (พยาน)',use:'ใช้กับ witness, thoroughly',ex:['The lawyer cross-examined the witness.','She was cross-examined thoroughly.','Skilled cross-examination often reveals inconsistencies in a witness’s testimony.']},
{cat:'law',w:'litigant',pos:'n.',en:'a person involved in a lawsuit',th:'คู่ความในคดี',use:'ใช้กับ opposing, self-represented',ex:['Both litigants presented evidence.','The self-represented litigant struggled in court.','The two litigants finally reached a settlement before the trial concluded.']},
{cat:'law',w:'settlement',pos:'n.',en:'an official agreement that resolves a dispute, often without going to trial',th:'การยุติข้อพิพาทนอกศาล/ข้อตกลง',use:'ใช้กับ reach, out-of-court',ex:['They reached a settlement.','The company offered an out-of-court settlement.','Both sides agreed to a financial settlement rather than proceeding to trial.']},
{cat:'law',w:'class action',pos:'phrase',en:'a lawsuit filed by a group of people who have suffered similar harm',th:'คดีฟ้องร้องแบบกลุ่ม',use:'ใช้กับ file, join',ex:['Customers filed a class action.','She joined the class action lawsuit.','The class action forced the company to compensate thousands of affected customers.']},
{cat:'law',w:'human rights',pos:'phrase',en:'the basic rights and freedoms that belong to every person',th:'สิทธิมนุษยชน',use:'ใช้กับ violate, protect',ex:['The regime violated human rights.','Organizations work to protect human rights.','International bodies condemned the government for its human rights abuses.']},

// ============ RELIGION & BELIEF (25) ============
{cat:'religion',w:'faith',pos:'n.',en:'strong belief in a religion or set of spiritual principles',th:'ศรัทธา/ความเชื่อทางศาสนา',use:'ใช้กับ religious, lose, keep',ex:['She has strong religious faith.','He lost his faith after the tragedy.','Many people find comfort and community through their shared faith.']},
{cat:'religion',w:'doctrine',pos:'n.',en:'a set of beliefs or principles held and taught by a religion or institution',th:'หลักคำสอน',use:'ใช้กับ religious, follow',ex:['The church follows strict doctrine.','Religious doctrine shapes daily life.','Followers are expected to accept the core doctrines of their faith.']},
{cat:'religion',w:'scripture',pos:'n.',en:'the sacred writings of a religion',th:'คัมภีร์ศาสนา',use:'ใช้กับ study, quote',ex:['He studies religious scripture.','She quoted a line from scripture.','Scholars have spent centuries interpreting ancient religious scripture.']},
{cat:'religion',w:'theology',pos:'n.',en:'the study of religious beliefs and the nature of the divine',th:'เทววิทยา',use:'ใช้กับ study, branch of',ex:['She studies theology at university.','Theology explores questions about God.','Comparative theology examines beliefs across several different world religions.']},
{cat:'religion',w:'spirituality',pos:'n.',en:'a personal sense of connection to something greater than oneself, often beyond organized religion',th:'จิตวิญญาณ/ความเชื่อทางจิตใจ',use:'ใช้กับ personal, explore',ex:['He explores his own spirituality.','Spirituality brings her peace.','Many people separate personal spirituality from formal religious practice.']},
{cat:'religion',w:'worship',pos:'n./v.',en:'the expression of reverence for a deity, often through prayer or ritual',th:'การบูชา/นมัสการ',use:'ใช้กับ place of, practice',ex:['They gathered to worship together.','The temple is a place of worship.','Communities around the world worship in remarkably different ways.']},
{cat:'religion',w:'congregation',pos:'n.',en:'a group of people gathered for religious worship',th:'กลุ่มผู้เข้าร่วมศาสนพิธี',use:'ใช้กับ address, join',ex:['The priest addressed the congregation.','She joined a local congregation.','The congregation gathered every Sunday for the weekly service.']},
{cat:'religion',w:'clergy',pos:'n.',en:'religious leaders formally authorized to perform religious duties',th:'นักบวช/บาทหลวง (โดยรวม)',use:'ใช้กับ member of, ordained',ex:['He is a member of the clergy.','The clergy conducted the ceremony.','Members of the clergy often play an important role in their local community.']},
{cat:'religion',w:'pilgrimage',pos:'n.',en:'a journey to a sacred place, made for religious reasons',th:'การแสวงบุญ',use:'ใช้กับ undertake, sacred',ex:['She undertook a religious pilgrimage.','Thousands make the annual pilgrimage.','Pilgrims travel great distances to visit sites considered especially sacred.']},
{cat:'religion',w:'sacred',pos:'adj.',en:'regarded with deep religious respect and reverence',th:'ศักดิ์สิทธิ์',use:'ใช้กับ site, consider',ex:['The temple is a sacred site.','They consider the river sacred.','Visitors are expected to behave respectfully at sacred religious sites.']},
{cat:'religion',w:'divine',pos:'adj.',en:'relating to or coming from God or a deity',th:'เกี่ยวกับพระเจ้า/ศักดิ์สิทธิ์',use:'ใช้กับ intervention, believe in',ex:['She believes in divine guidance.','They prayed for divine intervention.','Followers believe the scripture reflects divine wisdom passed down through generations.']},
{cat:'religion',w:'afterlife',pos:'n.',en:'a life believed to continue after physical death',th:'ชีวิตหลังความตาย',use:'ใช้กับ believe in, concept of',ex:['Many religions believe in an afterlife.','The concept of the afterlife varies widely.','Beliefs about the afterlife strongly influence how different cultures approach death.']},

let currentIndex = 0;
let currentList = vocab.map((v,i)=>i);
let activeCat = 'all';
let flipped = false;

const tabsEl = document.getElementById('tabs');
const cardEl = document.getElementById('card');
const faceFront = document.getElementById('faceFront');
const faceBack = document.getElementById('faceBack');
const counterEl = document.getElementById('counter');
const metaLine = document.getElementById('metaLine');
const searchInput = document.getElementById('searchInput');

function catInfo(id){ return categories.find(c=>c.id===id); }

function buildTabs(){
  const all = document.createElement('button');
  all.className = 'tab' + (activeCat==='all' ? ' active':'');
  all.textContent = `ทั้งหมด (${vocab.length})`;
  all.style.background = '#8A8577';
  all.onclick = ()=>{ activeCat='all'; applyFilter(); };
  tabsEl.appendChild(all);
  categories.forEach(c=>{
    const count = vocab.filter(v=>v.cat===c.id).length;
    const btn = document.createElement('button');
    btn.className = 'tab' + (activeCat===c.id ? ' active':'');
    btn.textContent = `${c.name} (${count})`;
    btn.style.background = c.color;
    btn.onclick = ()=>{ activeCat=c.id; applyFilter(); };
    tabsEl.appendChild(btn);
  });
}

function applyFilter(){
  const q = searchInput.value.trim().toLowerCase();
  currentList = vocab
    .map((v,i)=>i)
    .filter(i=>{
      const v = vocab[i];
      const matchCat = activeCat==='all' || v.cat===activeCat;
      const matchSearch = !q || v.w.toLowerCase().includes(q) || v.th.includes(q);
      return matchCat && matchSearch;
    });
  currentIndex = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  Array.from(tabsEl.children).forEach((el,idx)=>{
    el.classList.remove('active');
  });
  Array.from(tabsEl.children).forEach((el)=>{
    const isAll = el.textContent.startsWith('ทั้งหมด');
    if(activeCat==='all' && isAll) el.classList.add('active');
  });
  categories.forEach((c,idx)=>{
    const el = tabsEl.children[idx+1];
    if(activeCat===c.id) el.classList.add('active');
  });
  render();
}

function render(){
  if(currentList.length===0){
    faceFront.innerHTML = '<div class="empty-state">ไม่พบคำศัพท์ที่ค้นหา</div>';
    faceBack.innerHTML = '';
    counterEl.innerHTML = '';
    metaLine.textContent = '';
    document.getElementById('prevBtn').disabled = true;
    document.getElementById('nextBtn').disabled = true;
    return;
  }
  const v = vocab[currentList[currentIndex]];
  const c = catInfo(v.cat);
  document.documentElement.style.setProperty('--accent', c.color);
  cardEl.style.setProperty('--accent', c.color);
  cardEl.style.setProperty('--accent-light', c.light);

  faceFront.innerHTML = `
    <div class="cat-chip">${c.name}</div>
    <div class="word-front">${v.w}</div>
    <div class="pos">${v.pos}</div>
    <div class="flip-hint">แตะการ์ดเพื่อดูความหมาย และตัวอย่างประโยค</div>
  `;
  faceBack.innerHTML = `
    <div class="cat-chip">${c.name}</div>
    <div class="word-back">${v.w} <span style="font-size:13px;color:var(--ink-soft);font-weight:400;font-style:italic;">${v.pos}</span></div>
    <div class="en-def"><span class="en-def-label">EN</span>${v.en}</div>
    <div class="th-meaning"><span class="th-meaning-label">TH</span>${v.th}</div>
    <div class="usage"><b>วิธีใช้:</b> ${v.use}</div>
    <div class="ex-label">ตัวอย่างประโยค (ง่าย → ซับซ้อน)</div>
    <ul class="ex-list">
      ${v.ex.map((s,i)=>`<li data-n="${i+1}">${s}</li>`).join('')}
    </ul>
  `;
  counterEl.innerHTML = `การ์ดที่ <b>${currentIndex+1}</b> จาก <b>${currentList.length}</b>`;
  metaLine.textContent = `รวมทั้งหมด ${vocab.length} คำ · 6 หมวดหมู่`;
  document.getElementById('prevBtn').disabled = currentIndex===0;
  document.getElementById('nextBtn').disabled = currentIndex===currentList.length-1;
}

cardEl.addEventListener('click', ()=>{
  if(currentList.length===0) return;
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
});

document.getElementById('prevBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  if(currentIndex>0){ currentIndex--; flipped=false; cardEl.classList.remove('flipped'); render(); }
});
document.getElementById('nextBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  if(currentIndex<currentList.length-1){ currentIndex++; flipped=false; cardEl.classList.remove('flipped'); render(); }
});
document.getElementById('shuffleBtn').addEventListener('click', ()=>{
  for(let i=currentList.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [currentList[i],currentList[j]] = [currentList[j],currentList[i]];
  }
  currentIndex = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  render();
});
searchInput.addEventListener('input', applyFilter);

document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') document.getElementById('nextBtn').click();
  if(e.key==='ArrowLeft') document.getElementById('prevBtn').click();
  if(e.key===' '){ e.preventDefault(); cardEl.click(); }
});

buildTabs();
applyFilter();
</script>
