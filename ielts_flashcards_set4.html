<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Advanced Vocabulary — คำศัพท์เตรียมสอบ IELTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC;
    --paper-line:#E4DFD2;
    --ink:#2B2822;
    --ink-soft:#6B6558;
    --card-bg:#FFFDF8;
    --shadow:rgba(43,40,34,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans Thai','Inter',sans-serif;
    background:
      repeating-linear-gradient(180deg, transparent, transparent 35px, var(--paper-line) 36px),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  /* Header */
  header{margin-bottom:22px;}
  .title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(26px,5vw,34px);
    margin:0;
    letter-spacing:-0.01em;
  }
  .set-badge{
    font-size:11.5px;font-weight:700;color:#fff;background:var(--ink);
    padding:4px 10px;border-radius:20px;letter-spacing:.02em;
    transform:translateY(-2px);
  }
  .title-th{font-family:'Noto Serif Thai',serif;font-size:16px;color:var(--ink-soft);margin:4px 0 0;}
  .meta-line{font-size:13px;color:var(--ink-soft);margin-top:10px;}

  /* Search */
  .search-box{margin:18px 0 14px;position:relative;}
  .search-box input{
    width:100%;
    padding:11px 14px 11px 38px;
    border-radius:10px;
    border:1.5px solid var(--paper-line);
    background:var(--card-bg);
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  .search-box input:focus{border-color:var(--ink-soft);}
  .search-box::before{
    content:"🔍";
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    font-size:14px;opacity:.55;
  }

  /* Category tabs styled like binder index tabs */
  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:20px;
    scrollbar-width:thin;
  }
  .tab{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:8px 8px 0 0;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    border:none;
    color:#fff;
    opacity:.55;
    transition:opacity .15s ease, transform .12s ease;
    white-space:nowrap;
  }
  .tab:hover{opacity:.8;}
  .tab.active{opacity:1;transform:translateY(-2px);}

  /* Flashcard */
  .card-stage{
    perspective:1400px;
    margin-bottom:16px;
  }
  .card{
    position:relative;
    width:100%;
    min-height:340px;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    border-radius:16px;
    background:var(--card-bg);
    box-shadow:0 10px 30px var(--shadow), 0 1px 0 rgba(255,255,255,.6) inset;
    border-left:7px solid var(--accent, #6A4C93);
    padding:30px 28px;
    display:flex;
    flex-direction:column;
  }
  .face-back{transform:rotateY(180deg);overflow-y:auto;}

  .cat-chip{
    align-self:flex-start;
    font-size:11.5px;
    font-weight:700;
    color:var(--accent, #6A4C93);
    background:var(--accent-light, #EFE7F5);
    padding:3px 10px;
    border-radius:20px;
    margin-bottom:16px;
    letter-spacing:.02em;
  }
  .word-front{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(32px,7vw,44px);
    line-height:1.1;
    margin:0 0 8px;
  }
  .pos{font-size:14px;color:var(--ink-soft);font-style:italic;margin-bottom:auto;}
  .flip-hint{
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed var(--paper-line);
  }

  .word-back{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin:0 0 4px;
  }
  .en-def{
    font-size:14px;
    color:var(--ink);
    margin:0 0 10px;
    line-height:1.6;
    padding-left:1px;
  }
  .en-def-label{
    font-size:10.5px;font-weight:700;letter-spacing:.04em;
    color:var(--accent,#6A4C93);margin-right:6px;
  }
  .th-meaning{
    font-family:'Noto Serif Thai',serif;
    font-size:16px;
    color:var(--ink);
    margin:0 0 14px;
    line-height:1.55;
  }
  .th-meaning-label{
    font-size:10.5px;font-weight:700;letter-spacing:.04em;
    font-family:'Noto Sans Thai',sans-serif;
    color:var(--accent,#6A4C93);margin-right:6px;
  }
  .usage{
    font-size:13.5px;
    color:var(--ink-soft);
    background:var(--paper);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:16px;
    line-height:1.6;
  }
  .usage b{color:var(--ink);}
  .ex-label{font-size:12px;font-weight:700;color:var(--accent,#6A4C93);letter-spacing:.03em;margin-bottom:8px;}
  .ex-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .ex-list li{
    font-size:14px;
    line-height:1.55;
    padding-left:22px;
    position:relative;
  }
  .ex-list li::before{
    content:attr(data-n);
    position:absolute;left:0;top:1px;
    font-size:11px;font-weight:700;
    color:#fff;background:var(--accent,#6A4C93);
    width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .ex-list mark{
    background:var(--accent-light,#EFE7F5);
    color:var(--accent,#6A4C93);
    padding:0 3px;
    border-radius:3px;
    font-weight:600;
  }

  /* Controls */
  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:18px;
  }
  .nav-btn{
    background:var(--card-bg);
    border:1.5px solid var(--paper-line);
    border-radius:10px;
    width:44px;height:44px;
    font-size:18px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease;
    flex:0 0 auto;
  }
  .nav-btn:hover{background:var(--paper);}
  .nav-btn:disabled{opacity:.35;cursor:default;}
  .counter{
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    flex:1;
  }
  .counter b{color:var(--ink);}
  .shuffle-btn{
    background:var(--card-bg);
    border:1.5px solid var(--paper-line);
    border-radius:10px;
    padding:0 16px;height:44px;
    font-size:13px;font-weight:600;
    font-family:inherit;
    cursor:pointer;
    color:var(--ink);
    display:flex;align-items:center;gap:6px;
    flex:0 0 auto;
  }
  .shuffle-btn:hover{background:var(--paper);}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:14px;
  }

  @media (max-width:480px){
    .face{padding:24px 20px;}
    .controls{flex-wrap:wrap;}
    .counter{order:3;width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-row">
      <h1>IELTS Advanced Vocabulary</h1>
      <span class="set-badge">ชุดที่ 4</span>
    </div>
    <p class="title-th">คำศัพท์ขั้นสูง 150 คำ แบ่งตามหัวข้อ พร้อมคำจำกัดความภาษาอังกฤษ ความหมายไทย วิธีใช้ และตัวอย่างประโยค 3 ระดับ</p>
    <p class="meta-line" id="metaLine"></p>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="ค้นหาคำศัพท์ หรือ พิมพ์คำแปลไทย...">
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="card-stage">
    <div class="card" id="card">
      <div class="face face-front" id="faceFront"></div>
      <div class="face face-back" id="faceBack"></div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" title="คำก่อนหน้า">←</button>
    <div class="counter" id="counter"></div>
    <button class="nav-btn" id="nextBtn" title="คำถัดไป">→</button>
  </div>
  <div class="controls" style="margin-top:10px;justify-content:center;">
    <button class="shuffle-btn" id="shuffleBtn">🔀 สุ่มลำดับ</button>
  </div>
</div>

<script>
const categories = [
  {id:'space', name:'อวกาศ-ดาราศาสตร์', color:'#38356B', light:'#E2E1EE'},
  {id:'history', name:'ประวัติศาสตร์-โบราณคดี', color:'#8C6239', light:'#EFE6D8'},
  {id:'psychology', name:'จิตวิทยา-พฤติกรรมมนุษย์', color:'#7A5468', light:'#ECE0E6'},
  {id:'business', name:'ธุรกิจ-การตลาด', color:'#3A5568', light:'#E1E7EB'},
  {id:'language', name:'ภาษา-ภาษาศาสตร์', color:'#A85C3A', light:'#F4E2D8'},
  {id:'energy', name:'พลังงาน-อุตสาหกรรม', color:'#B98A2E', light:'#F3E9D5'},
];

const vocab = [

// ============ SPACE & ASTRONOMY (25) ============
{cat:'space',w:'orbit',pos:'n./v.',en:'the curved path of an object around a star, planet, or moon; to move in such a path',th:'วงโคจร/โคจร',use:'ใช้กับ Earth’s, complete an',ex:['The moon orbits the Earth.','The satellite completed its orbit.','Scientists calculated the exact orbit needed to keep the satellite in position.']},
{cat:'space',w:'galaxy',pos:'n.',en:'a huge system of stars, gas, and dust held together by gravity',th:'ดาราจักร',use:'ใช้กับ spiral, distant',ex:['Our galaxy is called the Milky Way.','Astronomers study distant galaxies.','Telescopes have captured images of galaxies billions of light-years away.']},
{cat:'space',w:'celestial',pos:'adj.',en:'relating to the sky or outer space',th:'เกี่ยวกับท้องฟ้า/เทหวัตถุ',use:'ใช้กับ body, object',ex:['Stars are celestial bodies.','They observed a celestial event.','Ancient civilizations tracked celestial movements to develop early calendars.']},
{cat:'space',w:'gravity',pos:'n.',en:'the force that attracts objects toward each other, especially toward the center of a planet',th:'แรงโน้มถ่วง',use:'ใช้กับ Earth’s, zero',ex:['Gravity pulls objects down.','Earth’s gravity keeps us grounded.','Scientists study how gravity affects the human body during long space missions.']},
{cat:'space',w:'asteroid',pos:'n.',en:'a small rocky object that orbits the sun',th:'ดาวเคราะห์น้อย',use:'ใช้กับ belt, collide',ex:['An asteroid passed near Earth.','Scientists tracked the asteroid’s path.','A large asteroid impact is believed to have caused the extinction of the dinosaurs.']},
{cat:'space',w:'telescope',pos:'n.',en:'an instrument used to observe distant objects, especially in space',th:'กล้องโทรทรรศน์',use:'ใช้กับ powerful, point',ex:['He looked through a telescope.','The powerful telescope revealed new stars.','The new space telescope allows scientists to observe galaxies never seen before.']},
{cat:'space',w:'satellite',pos:'n.',en:'an object that orbits a planet, either natural or artificial',th:'ดาวเทียม',use:'ใช้กับ launch, communication',ex:['The company launched a satellite.','Satellites help with communication.','Weather satellites provide crucial data for predicting storms accurately.']},
{cat:'space',w:'cosmos',pos:'n.',en:'the universe considered as a well-ordered whole',th:'จักรวาล',use:'ใช้กับ vast, explore',ex:['The cosmos is vast.','Scientists try to understand the cosmos.','Humans have long been fascinated by their place within the vast cosmos.']},
{cat:'space',w:'astronaut',pos:'n.',en:'a person trained to travel and work in space',th:'นักบินอวกาศ',use:'ใช้กับ train, mission',ex:['The astronaut trained for years.','Astronauts conducted experiments in space.','The astronaut spent six months aboard the international space station.']},
{cat:'space',w:'spacecraft',pos:'n.',en:'a vehicle designed to travel in space',th:'ยานอวกาศ',use:'ใช้กับ launch, design',ex:['The spacecraft launched successfully.','Engineers designed the new spacecraft.','The spacecraft traveled millions of kilometers before reaching its destination.']},
{cat:'space',w:'launch',pos:'v./n.',en:'to send a rocket, satellite, or spacecraft into space',th:'ปล่อย (จรวด/ดาวเทียม)',use:'ใช้กับ rocket, successful',ex:['They launched the rocket.','The launch was successful.','Engineers delayed the launch due to unfavorable weather conditions.']},
{cat:'space',w:'trajectory',pos:'n.',en:'the curved path followed by an object moving through space',th:'วิถีการเคลื่อนที่',use:'ใช้กับ calculate, precise',ex:['They calculated the rocket’s trajectory.','The trajectory was precise.','A slight error in trajectory can cause a spacecraft to miss its target entirely.']},
{cat:'space',w:'interstellar',pos:'adj.',en:'relating to or occurring between stars',th:'ระหว่างดวงดาว',use:'ใช้กับ travel, space',ex:['Interstellar travel remains difficult.','The film explores interstellar space.','Interstellar distances are so vast that light itself takes years to cross them.']},
{cat:'space',w:'extraterrestrial',pos:'adj.',en:'originating from or existing outside the Earth',th:'นอกโลก',use:'ใช้กับ life, search for',ex:['Scientists search for extraterrestrial life.','The film features extraterrestrial creatures.','No confirmed evidence of extraterrestrial life has yet been discovered.']},
{cat:'space',w:'lunar',pos:'adj.',en:'relating to the moon',th:'เกี่ยวกับดวงจันทร์',use:'ใช้กับ mission, surface, calendar',ex:['They studied the lunar surface.','The lunar mission was a success.','Several countries are planning new lunar missions in the coming years.']},
{cat:'space',w:'solar system',pos:'phrase',en:'the sun and all the planets and other bodies that orbit it',th:'ระบบสุริยะ',use:'ใช้กับ explore, edge of',ex:['Earth is part of the solar system.','They study our solar system.','Probes have now reached the outer edge of our solar system.']},
{cat:'space',w:'nebula',pos:'n.',en:'a cloud of gas and dust in space, often where stars are formed',th:'เนบิวลา (กลุ่มแก๊สและฝุ่นในอวกาศ)',use:'ใช้กับ observe, form',ex:['The telescope captured a nebula.','Stars form within a nebula.','New stars are constantly being born within massive interstellar nebulae.']},
{cat:'space',w:'black hole',pos:'phrase',en:'a region of space with gravity so strong that nothing, not even light, can escape',th:'หลุมดำ',use:'ใช้กับ form, discover',ex:['A black hole forms from a collapsed star.','Scientists photographed a black hole.','Astronomers recently captured the first direct image of a black hole.']},
{cat:'space',w:'cosmic',pos:'adj.',en:'relating to the universe, especially as distinct from Earth',th:'เกี่ยวกับจักรวาล',use:'ใช้กับ ray, event',ex:['Cosmic rays reach Earth constantly.','It was a cosmic event.','Cosmic radiation poses a serious risk to astronauts on long space missions.']},
{cat:'space',w:'probe',pos:'n.',en:'an unmanned spacecraft sent to gather information, especially in space',th:'ยานสำรวจอวกาศ',use:'ใช้กับ space, send',ex:['They sent a probe to Mars.','The probe collected valuable data.','The space probe transmitted images back to Earth for over a decade.']},
{cat:'space',w:'exploration',pos:'n.',en:'the act of traveling through and investigating an unfamiliar area',th:'การสำรวจ',use:'ใช้กับ space, deep-sea',ex:['Space exploration excites scientists.','They fund ocean exploration too.','Continued space exploration could eventually lead to human settlement on other planets.']},
{cat:'space',w:'propulsion',pos:'n.',en:'the force that drives something forward, especially a vehicle or rocket',th:'ระบบขับเคลื่อน',use:'ใช้กับ system, rocket',ex:['The rocket uses powerful propulsion.','Engineers improved the propulsion system.','New propulsion technology could dramatically shorten travel time to Mars.']},
{cat:'space',w:'zero gravity',pos:'phrase',en:'a condition in which there is no apparent gravitational pull, as experienced in space',th:'ภาวะไร้น้ำหนัก',use:'ใช้กับ experience, float in',ex:['Astronauts float in zero gravity.','They trained for zero gravity.','Objects simply float when released in a zero gravity environment.']},
{cat:'space',w:'observatory',pos:'n.',en:'a building equipped with telescopes for observing stars and other astronomical objects',th:'หอดูดาว',use:'ใช้กับ build, visit',ex:['They visited the mountain observatory.','The observatory has a large telescope.','The observatory was built at high altitude to reduce atmospheric interference.']},
{cat:'space',w:'astronomical',pos:'adj.',en:'relating to astronomy, or extremely large in amount',th:'ทางดาราศาสตร์/มหาศาล',use:'ใช้กับ object, cost',ex:['They studied an astronomical object.','The cost was astronomical.','Building a new space telescope requires an astronomical budget.']},

// ============ HISTORY & ARCHAEOLOGY (25) ============
{cat:'history',w:'artifact',pos:'n.',en:'an object made by humans, especially one of historical or cultural interest',th:'โบราณวัตถุ',use:'ใช้กับ ancient, discover',ex:['They found an ancient artifact.','The museum displays rare artifacts.','Archaeologists carefully catalogued every artifact discovered at the site.']},
{cat:'history',w:'excavation',pos:'n.',en:'the process of digging in the ground to uncover buried objects or structures',th:'การขุดค้นทางโบราณคดี',use:'ใช้กับ site, conduct',ex:['The excavation revealed old walls.','They conducted a careful excavation.','The excavation took several years to complete due to the site’s complexity.']},
{cat:'history',w:'archaeologist',pos:'n.',en:'a person who studies human history through the excavation of sites and artifacts',th:'นักโบราณคดี',use:'ใช้กับ team of, discover',ex:['The archaeologist studied ancient pottery.','A team of archaeologists arrived.','Archaeologists spent decades piecing together the city’s forgotten history.']},
{cat:'history',w:'civilization',pos:'n.',en:'a complex society with developed culture, government, and technology',th:'อารยธรรม',use:'ใช้กับ ancient, rise and fall of',ex:['Ancient civilization thrived here.','The civilization eventually collapsed.','Historians continue to debate what caused the sudden fall of this civilization.']},
{cat:'history',w:'ancient',pos:'adj.',en:'belonging to the very distant past',th:'โบราณ',use:'ใช้กับ ruins, civilization',ex:['They explored ancient ruins.','Ancient texts describe the event.','Ancient trade routes connected distant civilizations long before modern transport existed.']},
{cat:'history',w:'medieval',pos:'adj.',en:'relating to the Middle Ages, roughly between the 5th and 15th centuries',th:'ยุคกลาง',use:'ใช้กับ castle, period',ex:['They visited a medieval castle.','The medieval period lasted centuries.','Medieval towns were often built around a central marketplace and cathedral.']},
{cat:'history',w:'dynasty',pos:'n.',en:'a series of rulers from the same family',th:'ราชวงศ์',use:'ใช้กับ rule, powerful',ex:['The dynasty ruled for centuries.','A powerful dynasty controlled the region.','The dynasty eventually fell after years of internal conflict and rebellion.']},
{cat:'history',w:'monument',pos:'n.',en:'a structure built to commemorate a person or event',th:'อนุสรณ์สถาน',use:'ใช้กับ historic, build',ex:['They built a monument to the war heroes.','The historic monument attracts tourists.','The government restored the ancient monument for future generations to appreciate.']},
{cat:'history',w:'relic',pos:'n.',en:'an object surviving from an earlier time, often of historical interest',th:'สิ่งของหลงเหลือจากอดีต',use:'ใช้กับ ancient, sacred',ex:['They found a religious relic.','The relic is centuries old.','The sacred relic was carefully preserved inside a glass display case.']},
{cat:'history',w:'chronicle',pos:'n./v.',en:'a written record of events in the order they occurred; to record such events',th:'บันทึกเหตุการณ์ตามลำดับเวลา',use:'ใช้กับ historical, detailed',ex:['The book chronicles the war.','Historians study ancient chronicles.','The chronicle provides a detailed account of events over several centuries.']},
{cat:'history',w:'unearth',pos:'v.',en:'to discover something by digging in the ground',th:'ขุดค้นพบ',use:'ใช้กับ artifact, remains',ex:['Workers unearthed ancient bones.','Archaeologists unearthed a lost city.','The construction crew accidentally unearthed a set of ancient burial chambers.']},
{cat:'history',w:'antiquity',pos:'n.',en:'the ancient past, especially the period of ancient Greek and Roman civilization',th:'สมัยโบราณ/ความเป็นของโบราณ',use:'ใช้กับ classical, dating from',ex:['The statue dates from antiquity.','Classical antiquity influenced art.','Many modern legal principles trace their origins back to antiquity.']},
{cat:'history',w:'archive',pos:'n.',en:'a collection of historical documents or records kept for reference',th:'หอจดหมายเหตุ/คลังเอกสาร',use:'ใช้กับ national, store in',ex:['The documents are kept in an archive.','She researched the national archive.','Historians uncovered new evidence buried deep within the national archive.']},
{cat:'history',w:'colonization',pos:'n.',en:'the process of settling among and establishing control over a foreign land and its people',th:'การล่าอาณานิคม',use:'ใช้กับ era, impact of',ex:['Colonization changed the region.','The era of colonization ended.','The long-term impact of colonization is still felt across many former colonies today.']},
{cat:'history',w:'empire',pos:'n.',en:'a large group of states or territories ruled by a single supreme authority',th:'จักรวรรดิ',use:'ใช้กับ vast, rule, fall of',ex:['The empire covered vast land.','Historians study the empire’s rise.','The fall of the empire led to centuries of political fragmentation.']},
{cat:'history',w:'inscription',pos:'n.',en:'words carved or engraved onto a surface, especially stone or metal',th:'จารึก',use:'ใช้กับ ancient, decipher',ex:['They found an ancient inscription.','Scholars tried to decipher the inscription.','The inscription on the tomb wall took researchers years to decipher.']},
{cat:'history',w:'prehistoric',pos:'adj.',en:'relating to the period before written records existed',th:'ก่อนประวัติศาสตร์',use:'ใช้กับ era, remains',ex:['They found prehistoric remains.','The prehistoric era fascinates scientists.','Prehistoric cave paintings provide rare insight into early human life.']},

let currentIndex = 0;
let currentList = vocab.map((v,i)=>i);
let activeCat = 'all';
let flipped = false;

const tabsEl = document.getElementById('tabs');
const cardEl = document.getElementById('card');
const faceFront = document.getElementById('faceFront');
const faceBack = document.getElementById('faceBack');
const counterEl = document.getElementById('counter');
const metaLine = document.getElementById('metaLine');
const searchInput = document.getElementById('searchInput');

function catInfo(id){ return categories.find(c=>c.id===id); }

function buildTabs(){
  const all = document.createElement('button');
  all.className = 'tab' + (activeCat==='all' ? ' active':'');
  all.textContent = `ทั้งหมด (${vocab.length})`;
  all.style.background = '#8A8577';
  all.onclick = ()=>{ activeCat='all'; applyFilter(); };
  tabsEl.appendChild(all);
  categories.forEach(c=>{
    const count = vocab.filter(v=>v.cat===c.id).length;
    const btn = document.createElement('button');
    btn.className = 'tab' + (activeCat===c.id ? ' active':'');
    btn.textContent = `${c.name} (${count})`;
    btn.style.background = c.color;
    btn.onclick = ()=>{ activeCat=c.id; applyFilter(); };
    tabsEl.appendChild(btn);
  });
}

function applyFilter(){
  const q = searchInput.value.trim().toLowerCase();
  currentList = vocab
    .map((v,i)=>i)
    .filter(i=>{
      const v = vocab[i];
      const matchCat = activeCat==='all' || v.cat===activeCat;
      const matchSearch = !q || v.w.toLowerCase().includes(q) || v.th.includes(q);
      return matchCat && matchSearch;
    });
  currentIndex = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  Array.from(tabsEl.children).forEach((el,idx)=>{
    el.classList.remove('active');
  });
  Array.from(tabsEl.children).forEach((el)=>{
    const isAll = el.textContent.startsWith('ทั้งหมด');
    if(activeCat==='all' && isAll) el.classList.add('active');
  });
  categories.forEach((c,idx)=>{
    const el = tabsEl.children[idx+1];
    if(activeCat===c.id) el.classList.add('active');
  });
  render();
}

function render(){
  if(currentList.length===0){
    faceFront.innerHTML = '<div class="empty-state">ไม่พบคำศัพท์ที่ค้นหา</div>';
    faceBack.innerHTML = '';
    counterEl.innerHTML = '';
    metaLine.textContent = '';
    document.getElementById('prevBtn').disabled = true;
    document.getElementById('nextBtn').disabled = true;
    return;
  }
  const v = vocab[currentList[currentIndex]];
  const c = catInfo(v.cat);
  document.documentElement.style.setProperty('--accent', c.color);
  cardEl.style.setProperty('--accent', c.color);
  cardEl.style.setProperty('--accent-light', c.light);

  faceFront.innerHTML = `
    <div class="cat-chip">${c.name}</div>
    <div class="word-front">${v.w}</div>
    <div class="pos">${v.pos}</div>
    <div class="flip-hint">แตะการ์ดเพื่อดูความหมาย และตัวอย่างประโยค</div>
  `;
  faceBack.innerHTML = `
    <div class="cat-chip">${c.name}</div>
    <div class="word-back">${v.w} <span style="font-size:13px;color:var(--ink-soft);font-weight:400;font-style:italic;">${v.pos}</span></div>
    <div class="en-def"><span class="en-def-label">EN</span>${v.en}</div>
    <div class="th-meaning"><span class="th-meaning-label">TH</span>${v.th}</div>
    <div class="usage"><b>วิธีใช้:</b> ${v.use}</div>
    <div class="ex-label">ตัวอย่างประโยค (ง่าย → ซับซ้อน)</div>
    <ul class="ex-list">
      ${v.ex.map((s,i)=>`<li data-n="${i+1}">${s}</li>`).join('')}
    </ul>
  `;
  counterEl.innerHTML = `การ์ดที่ <b>${currentIndex+1}</b> จาก <b>${currentList.length}</b>`;
  metaLine.textContent = `รวมทั้งหมด ${vocab.length} คำ · 6 หมวดหมู่`;
  document.getElementById('prevBtn').disabled = currentIndex===0;
  document.getElementById('nextBtn').disabled = currentIndex===currentList.length-1;
}

cardEl.addEventListener('click', ()=>{
  if(currentList.length===0) return;
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
});

document.getElementById('prevBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  if(currentIndex>0){ currentIndex--; flipped=false; cardEl.classList.remove('flipped'); render(); }
});
document.getElementById('nextBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  if(currentIndex<currentList.length-1){ currentIndex++; flipped=false; cardEl.classList.remove('flipped'); render(); }
});
document.getElementById('shuffleBtn').addEventListener('click', ()=>{
  for(let i=currentList.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [currentList[i],currentList[j]] = [currentList[j],currentList[i]];
  }
  currentIndex = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  render();
});
searchInput.addEventListener('input', applyFilter);

document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') document.getElementById('nextBtn').click();
  if(e.key==='ArrowLeft') document.getElementById('prevBtn').click();
  if(e.key===' '){ e.preventDefault(); cardEl.click(); }
});

buildTabs();
applyFilter();
</script>
