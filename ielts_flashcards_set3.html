<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Advanced Vocabulary — คำศัพท์เตรียมสอบ IELTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC;
    --paper-line:#E4DFD2;
    --ink:#2B2822;
    --ink-soft:#6B6558;
    --card-bg:#FFFDF8;
    --shadow:rgba(43,40,34,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans Thai','Inter',sans-serif;
    background:
      repeating-linear-gradient(180deg, transparent, transparent 35px, var(--paper-line) 36px),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  /* Header */
  header{margin-bottom:22px;}
  .title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(26px,5vw,34px);
    margin:0;
    letter-spacing:-0.01em;
  }
  .set-badge{
    font-size:11.5px;font-weight:700;color:#fff;background:var(--ink);
    padding:4px 10px;border-radius:20px;letter-spacing:.02em;
    transform:translateY(-2px);
  }
  .title-th{font-family:'Noto Serif Thai',serif;font-size:16px;color:var(--ink-soft);margin:4px 0 0;}
  .meta-line{font-size:13px;color:var(--ink-soft);margin-top:10px;}

  /* Search */
  .search-box{margin:18px 0 14px;position:relative;}
  .search-box input{
    width:100%;
    padding:11px 14px 11px 38px;
    border-radius:10px;
    border:1.5px solid var(--paper-line);
    background:var(--card-bg);
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  .search-box input:focus{border-color:var(--ink-soft);}
  .search-box::before{
    content:"🔍";
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    font-size:14px;opacity:.55;
  }

  /* Category tabs styled like binder index tabs */
  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:20px;
    scrollbar-width:thin;
  }
  .tab{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:8px 8px 0 0;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    border:none;
    color:#fff;
    opacity:.55;
    transition:opacity .15s ease, transform .12s ease;
    white-space:nowrap;
  }
  .tab:hover{opacity:.8;}
  .tab.active{opacity:1;transform:translateY(-2px);}

  /* Flashcard */
  .card-stage{
    perspective:1400px;
    margin-bottom:16px;
  }
  .card{
    position:relative;
    width:100%;
    min-height:340px;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    border-radius:16px;
    background:var(--card-bg);
    box-shadow:0 10px 30px var(--shadow), 0 1px 0 rgba(255,255,255,.6) inset;
    border-left:7px solid var(--accent, #6A4C93);
    padding:30px 28px;
    display:flex;
    flex-direction:column;
  }
  .face-back{transform:rotateY(180deg);overflow-y:auto;}

  .cat-chip{
    align-self:flex-start;
    font-size:11.5px;
    font-weight:700;
    color:var(--accent, #6A4C93);
    background:var(--accent-light, #EFE7F5);
    padding:3px 10px;
    border-radius:20px;
    margin-bottom:16px;
    letter-spacing:.02em;
  }
  .word-front{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(32px,7vw,44px);
    line-height:1.1;
    margin:0 0 8px;
  }
  .pos{font-size:14px;color:var(--ink-soft);font-style:italic;margin-bottom:auto;}
  .flip-hint{
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed var(--paper-line);
  }

  .word-back{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin:0 0 4px;
  }
  .en-def{
    font-size:14px;
    color:var(--ink);
    margin:0 0 10px;
    line-height:1.6;
    padding-left:1px;
  }
  .en-def-label{
    font-size:10.5px;font-weight:700;letter-spacing:.04em;
    color:var(--accent,#6A4C93);margin-right:6px;
  }
  .th-meaning{
    font-family:'Noto Serif Thai',serif;
    font-size:16px;
    color:var(--ink);
    margin:0 0 14px;
    line-height:1.55;
  }
  .th-meaning-label{
    font-size:10.5px;font-weight:700;letter-spacing:.04em;
    font-family:'Noto Sans Thai',sans-serif;
    color:var(--accent,#6A4C93);margin-right:6px;
  }
  .usage{
    font-size:13.5px;
    color:var(--ink-soft);
    background:var(--paper);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:16px;
    line-height:1.6;
  }
  .usage b{color:var(--ink);}
  .ex-label{font-size:12px;font-weight:700;color:var(--accent,#6A4C93);letter-spacing:.03em;margin-bottom:8px;}
  .ex-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .ex-list li{
    font-size:14px;
    line-height:1.55;
    padding-left:22px;
    position:relative;
  }
  .ex-list li::before{
    content:attr(data-n);
    position:absolute;left:0;top:1px;
    font-size:11px;font-weight:700;
    color:#fff;background:var(--accent,#6A4C93);
    width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .ex-list mark{
    background:var(--accent-light,#EFE7F5);
    color:var(--accent,#6A4C93);
    padding:0 3px;
    border-radius:3px;
    font-weight:600;
  }

  /* Controls */
  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:18px;
  }
  .nav-btn{
    background:var(--card-bg);
    border:1.5px solid var(--paper-line);
    border-radius:10px;
    width:44px;height:44px;
    font-size:18px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease;
    flex:0 0 auto;
  }
  .nav-btn:hover{background:var(--paper);}
  .nav-btn:disabled{opacity:.35;cursor:default;}
  .counter{
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    flex:1;
  }
  .counter b{color:var(--ink);}
  .shuffle-btn{
    background:var(--card-bg);
    border:1.5px solid var(--paper-line);
    border-radius:10px;
    padding:0 16px;height:44px;
    font-size:13px;font-weight:600;
    font-family:inherit;
    cursor:pointer;
    color:var(--ink);
    display:flex;align-items:center;gap:6px;
    flex:0 0 auto;
  }
  .shuffle-btn:hover{background:var(--paper);}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:14px;
  }

  @media (max-width:480px){
    .face{padding:24px 20px;}
    .controls{flex-wrap:wrap;}
    .counter{order:3;width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-row">
      <h1>IELTS Advanced Vocabulary</h1>
      <span class="set-badge">ชุดที่ 3</span>
    </div>
    <p class="title-th">คำศัพท์ขั้นสูง 150 คำ แบ่งตามหัวข้อ พร้อมคำจำกัดความภาษาอังกฤษ ความหมายไทย วิธีใช้ และตัวอย่างประโยค 3 ระดับ</p>
    <p class="meta-line" id="metaLine"></p>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="ค้นหาคำศัพท์ หรือ พิมพ์คำแปลไทย...">
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="card-stage">
    <div class="card" id="card">
      <div class="face face-front" id="faceFront"></div>
      <div class="face face-back" id="faceBack"></div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" title="คำก่อนหน้า">←</button>
    <div class="counter" id="counter"></div>
    <button class="nav-btn" id="nextBtn" title="คำถัดไป">→</button>
  </div>
  <div class="controls" style="margin-top:10px;justify-content:center;">
    <button class="shuffle-btn" id="shuffleBtn">🔀 สุ่มลำดับ</button>
  </div>
</div>

<script>
const categories = [
  {id:'travel', name:'การเดินทาง-คมนาคม', color:'#2472A4', light:'#DCEAF2'},
  {id:'family', name:'ครอบครัว-ความสัมพันธ์', color:'#C1654A', light:'#F3E1D9'},
  {id:'housing', name:'ที่อยู่อาศัย-ผังเมือง', color:'#6B5D4F', light:'#EAE5DE'},
  {id:'art', name:'ศิลปะ-บันเทิง', color:'#A6447A', light:'#F0DCE9'},
  {id:'food', name:'อาหาร-เกษตรกรรม', color:'#7A8C3A', light:'#EAEEDA'},
  {id:'sport', name:'กีฬา-นันทนาการ', color:'#2E8C6B', light:'#DCEFE6'},
];

const vocab = [

// ============ TRAVEL & TRANSPORT (25) ============
{cat:'travel',w:'commute',pos:'v./n.',en:'to travel regularly between home and work',th:'เดินทางไปกลับที่ทำงาน/โรงเรียนเป็นประจำ',use:'ใช้กับ daily, long',ex:['She commutes to work by train.','His daily commute takes an hour.','Long commutes have been linked to higher stress and lower job satisfaction.']},
{cat:'travel',w:'itinerary',pos:'n.',en:'a planned route or schedule for a journey',th:'กำหนดการเดินทาง',use:'ใช้กับ plan, detailed, follow',ex:['We planned our travel itinerary.','She followed a detailed itinerary.','A flexible itinerary allows travelers to adjust their plans if unexpected opportunities arise.']},
{cat:'travel',w:'congestion',pos:'n.',en:'the state of being overcrowded or blocked, especially with traffic',th:'การจราจรติดขัด/ความแออัด',use:'ใช้กับ traffic, reduce, cause',ex:['Traffic congestion delayed the bus.','The city aims to reduce congestion.','Severe congestion during rush hour has pushed many commuters toward public transport.']},
{cat:'travel',w:'accessible',pos:'adj.',en:'able to be reached, entered, or used easily',th:'เข้าถึงได้ง่าย',use:'ใช้กับ easily, wheelchair',ex:['The station is easily accessible.','The building is wheelchair accessible.','Making public transport more accessible benefits elderly and disabled passengers alike.']},
{cat:'travel',w:'transit',pos:'n.',en:'the system of traveling around an area using public transport, or the act of passing through',th:'การขนส่งสาธารณะ/การผ่านทาง',use:'ใช้กับ public, in transit',ex:['She uses public transit daily.','The package is currently in transit.','Investment in public transit has reduced private car use in several major cities.']},
{cat:'travel',w:'terminal',pos:'n.',en:'a building where passengers begin or end a journey, such as at an airport',th:'อาคารผู้โดยสาร/สถานีปลายทาง',use:'ใช้กับ airport, bus, arrive at',ex:['We arrived at the terminal early.','The airport has three terminals.','Passengers were redirected to a different terminal due to construction work.']},
{cat:'travel',w:'layover',pos:'n.',en:'a short stay in a place between parts of a journey, especially a flight',th:'การแวะพักระหว่างการเดินทาง (เที่ยวบิน)',use:'ใช้กับ long, short, during',ex:['We had a two-hour layover.','She explored the city during her layover.','A long layover gave passengers enough time to leave the airport and explore downtown.']},
{cat:'travel',w:'jet lag',pos:'phrase',en:'tiredness and disorientation caused by rapid travel across time zones',th:'อาการเพลียจากการเปลี่ยนเขตเวลา',use:'ใช้กับ suffer from, recover from',ex:['He suffered from jet lag.','It took days to recover from jet lag.','Frequent long-haul travelers often develop strategies to minimize the effects of jet lag.']},
{cat:'travel',w:'excursion',pos:'n.',en:'a short trip taken for pleasure or a specific purpose',th:'การท่องเที่ยวระยะสั้น/ทัศนศึกษา',use:'ใช้กับ day, organize, go on',ex:['We went on a day excursion.','The school organized an excursion.','The tour company offers optional excursions to nearby historical sites.']},
{cat:'travel',w:'nomadic',pos:'adj.',en:'living a lifestyle that involves moving from place to place rather than settling',th:'เร่ร่อน/ไม่มีถิ่นที่อยู่ถาวร',use:'ใช้กับ lifestyle, tribe',ex:['They lead a nomadic lifestyle.','The tribe remains nomadic.','Remote work has allowed some professionals to adopt a semi-nomadic lifestyle.']},
{cat:'travel',w:'customs',pos:'n.',en:'the official process and place where goods entering a country are checked and taxed',th:'ด่านศุลกากร',use:'ใช้กับ clear, go through, declare',ex:['We cleared customs quickly.','He declared items at customs.','Travelers must go through customs and declare any restricted goods before entering the country.']},
{cat:'travel',w:'voyage',pos:'n.',en:'a long journey, especially by sea or in space',th:'การเดินทางไกล (ทางเรือ)',use:'ใช้กับ sea, embark on',ex:['They embarked on a sea voyage.','The voyage lasted three weeks.','Early explorers undertook dangerous voyages across uncharted oceans.']},
{cat:'travel',w:'expedition',pos:'n.',en:'an organized journey undertaken for a specific purpose, such as exploration',th:'การเดินทางสำรวจ',use:'ใช้กับ scientific, mount, lead',ex:['They organized a scientific expedition.','She led an expedition to Antarctica.','The expedition faced extreme weather conditions throughout the journey.']},
{cat:'travel',w:'picturesque',pos:'adj.',en:'visually attractive, especially in a quaint or charming way',th:'สวยงามน่าประทับใจ (ภูมิทัศน์)',use:'ใช้กับ village, view, scenery',ex:['It’s a picturesque village.','The route offers picturesque views.','Tourists are drawn to the picturesque coastline dotted with small fishing villages.']},
{cat:'travel',w:'logistics',pos:'n.',en:'the detailed coordination of complex operations, especially transport and supply',th:'การจัดการด้านการขนส่งและกระจายสินค้า',use:'ใช้กับ manage, complex',ex:['The event required careful logistics.','They manage shipping logistics.','Coordinating logistics for a large international conference can take months of planning.']},
{cat:'travel',w:'hub',pos:'n.',en:'a central point where activity or transport connects',th:'ศูนย์กลางการคมนาคม',use:'ใช้กับ transport, major',ex:['The airport is a major hub.','The city is a transport hub.','The port became a key trading hub connecting several regional economies.']},
{cat:'travel',w:'gridlock',pos:'n.',en:'a situation in which traffic is completely blocked and unable to move',th:'การจราจรติดขัดอย่างหนัก',use:'ใช้กับ traffic, cause',ex:['Traffic gridlock lasted for hours.','An accident caused gridlock downtown.','The construction project caused gridlock throughout the city center for several weeks.']},
{cat:'travel',w:'pedestrian',pos:'n./adj.',en:'a person walking rather than traveling in a vehicle',th:'คนเดินเท้า/สำหรับคนเดินเท้า',use:'ใช้กับ zone, crossing, area',ex:['The area is a pedestrian zone.','Pedestrians crossed carefully.','The city converted several streets into pedestrian-only zones to reduce traffic.']},
{cat:'travel',w:'commuter',pos:'n.',en:'a person who regularly travels between home and work',th:'ผู้เดินทางไปกลับที่ทำงานเป็นประจำ',use:'ใช้กับ daily, rush hour',ex:['Commuters filled the platform.','Rush hour is busy for commuters.','Many commuters prefer trains over driving to avoid daily traffic congestion.']},
{cat:'travel',w:'fare',pos:'n.',en:'the price charged for a journey on public transport',th:'ค่าโดยสาร',use:'ใช้กับ bus, train, raise',ex:['The bus fare increased.','She paid the train fare.','The city raised public transport fares to help cover rising maintenance costs.']},
{cat:'travel',w:'destination',pos:'n.',en:'the place to which someone is traveling',th:'จุดหมายปลายทาง',use:'ใช้กับ popular, tourist, final',ex:['Paris is a popular destination.','We reached our final destination.','The island has become a favorite destination for travelers seeking quiet beaches.']},
{cat:'travel',w:'detour',pos:'n.',en:'a longer route taken to avoid an obstacle or blocked road',th:'เส้นทางอ้อม',use:'ใช้กับ take, force',ex:['We took a detour around the flood.','Roadwork forced a detour.','The unexpected detour added nearly an hour to their journey.']},
{cat:'travel',w:'transfer',pos:'n.',en:'the act of changing from one vehicle or route to another during a journey',th:'การเปลี่ยนต่อ (พาหนะ)',use:'ใช้กับ train, make a',ex:['We need to transfer trains.','The transfer took ten minutes.','Passengers must make a transfer at the central station to reach the coast.']},
{cat:'travel',w:'stopover',pos:'n.',en:'a short stay at a place during a longer journey',th:'การแวะพักระหว่างทาง',use:'ใช้กับ overnight, brief',ex:['We had an overnight stopover.','The flight includes a brief stopover.','An overnight stopover gave them a chance to briefly explore the city.']},
{cat:'travel',w:'backpacking',pos:'n.',en:'traveling or hiking with one’s belongings carried in a backpack, usually on a low budget',th:'การท่องเที่ยวแบบสะพายเป้ (งบประหยัด)',use:'ใช้กับ go, trip',ex:['They went backpacking through Asia.','She loves backpacking trips.','Backpacking allows travelers to experience a country more closely on a limited budget.']},

// ============ FAMILY & RELATIONSHIPS (25) ============
{cat:'family',w:'upbringing',pos:'n.',en:'the way a person is cared for and raised during childhood',th:'การเลี้ยงดู',use:'ใช้กับ strict, shape',ex:['He had a strict upbringing.','Her upbringing shaped her values.','A supportive upbringing can significantly influence a child’s confidence later in life.']},
{cat:'family',w:'sibling',pos:'n.',en:'a brother or sister',th:'พี่น้อง',use:'ใช้กับ rivalry, close',ex:['She has two siblings.','Sibling rivalry is common.','Close sibling relationships often provide lasting emotional support throughout life.']},
{cat:'family',w:'nurture',pos:'v.',en:'to care for and encourage the growth or development of someone',th:'เลี้ยงดู/บ่มเพาะ',use:'ใช้กับ child, talent',ex:['Parents nurture their children.','The school nurtures creativity.','Teachers play an important role in nurturing a child’s natural curiosity.']},
{cat:'family',w:'dependent',pos:'n./adj.',en:'a person who relies on another for financial or other support',th:'ผู้ที่ต้องพึ่งพา/ต้องพึ่งพา',use:'ใช้กับ financial, elderly',ex:['She has two dependents.','He is financially dependent on his parents.','Caring for elderly dependents places a growing burden on many working families.']},
{cat:'family',w:'estranged',pos:'adj.',en:'no longer close or in contact with a family member, often due to conflict',th:'ห่างเหิน/แยกทางกัน',use:'ใช้กับ from, become',ex:['He is estranged from his father.','They became estranged after the argument.','After years of being estranged, the siblings slowly began speaking to each other again.']},
{cat:'family',w:'bond',pos:'n.',en:'a close emotional connection between people',th:'ความผูกพัน',use:'ใช้กับ form, strong, emotional',ex:['They share a close bond.','The trip strengthened their bond.','Shared experiences during childhood often create bonds that last a lifetime.']},
{cat:'family',w:'nuclear family',pos:'phrase',en:'a family unit consisting of parents and their children, not including other relatives',th:'ครอบครัวเดี่ยว',use:'ตรงข้ามกับ extended family',ex:['They live as a nuclear family.','The nuclear family is common in cities.','Sociologists have studied how the traditional nuclear family has changed over generations.']},
{cat:'family',w:'extended family',pos:'phrase',en:'a family that includes relatives beyond parents and children, such as grandparents and cousins',th:'ครอบครัวขยาย',use:'ตรงข้ามกับ nuclear family',ex:['Her extended family visits often.','They rely on their extended family.','In many cultures, the extended family plays a central role in raising children.']},
{cat:'family',w:'guardian',pos:'n.',en:'a person legally responsible for the care of someone who cannot care for themselves',th:'ผู้ปกครอง (ตามกฎหมาย)',use:'ใช้กับ legal, appoint',ex:['Her aunt became her guardian.','The court appointed a legal guardian.','A legal guardian is responsible for the child’s welfare until they reach adulthood.']},
{cat:'family',w:'caregiver',pos:'n.',en:'a person who looks after someone who is ill, elderly, or unable to care for themselves',th:'ผู้ดูแล',use:'ใช้กับ primary, family',ex:['She is the primary caregiver.','Family caregivers often feel exhausted.','Being a full-time caregiver can be both rewarding and emotionally demanding.']},
{cat:'family',w:'domestic',pos:'adj.',en:'relating to the running of a home or family life',th:'เกี่ยวกับบ้าน/ในครัวเรือน',use:'ใช้กับ chore, responsibility',ex:['They share domestic chores.','Domestic responsibilities fell mostly on her.','Balancing domestic responsibilities with a career remains challenging for many parents.']},
{cat:'family',w:'household',pos:'n.',en:'a house and its occupants regarded as a unit',th:'ครัวเรือน',use:'ใช้กับ single-parent, average',ex:['It’s a single-parent household.','The average household has four members.','Rising costs have put pressure on household budgets across the country.']},

{cat:'sport',w:'comeback',pos:'n.',en:'a return to a former successful position after a setback or absence',th:'การกลับมา (หลังจากพ่ายแพ้หรือหายไป)',use:'ใช้กับ stage, remarkable',ex:['The team staged a comeback.','Her comeback surprised everyone.','The injured athlete made a remarkable comeback to win the championship the following year.']},

let currentIndex = 0;
let currentList = vocab.map((v,i)=>i);
let activeCat = 'all';
let flipped = false;

const tabsEl = document.getElementById('tabs');
const cardEl = document.getElementById('card');
const faceFront = document.getElementById('faceFront');
const faceBack = document.getElementById('faceBack');
const counterEl = document.getElementById('counter');
const metaLine = document.getElementById('metaLine');
const searchInput = document.getElementById('searchInput');

function catInfo(id){ return categories.find(c=>c.id===id); }

function buildTabs(){
  const all = document.createElement('button');
  all.className = 'tab' + (activeCat==='all' ? ' active':'');
  all.textContent = `ทั้งหมด (${vocab.length})`;
  all.style.background = '#8A8577';
  all.onclick = ()=>{ activeCat='all'; applyFilter(); };
  tabsEl.appendChild(all);
  categories.forEach(c=>{
    const count = vocab.filter(v=>v.cat===c.id).length;
    const btn = document.createElement('button');
    btn.className = 'tab' + (activeCat===c.id ? ' active':'');
    btn.textContent = `${c.name} (${count})`;
    btn.style.background = c.color;
    btn.onclick = ()=>{ activeCat=c.id; applyFilter(); };
    tabsEl.appendChild(btn);
  });
}

function applyFilter(){
  const q = searchInput.value.trim().toLowerCase();
  currentList = vocab
    .map((v,i)=>i)
    .filter(i=>{
      const v = vocab[i];
      const matchCat = activeCat==='all' || v.cat===activeCat;
      const matchSearch = !q || v.w.toLowerCase().includes(q) || v.th.includes(q);
      return matchCat && matchSearch;
    });
  currentIndex = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  Array.from(tabsEl.children).forEach((el,idx)=>{
    el.classList.remove('active');
  });
  Array.from(tabsEl.children).forEach((el)=>{
    const isAll = el.textContent.startsWith('ทั้งหมด');
    if(activeCat==='all' && isAll) el.classList.add('active');
  });
  categories.forEach((c,idx)=>{
    const el = tabsEl.children[idx+1];
    if(activeCat===c.id) el.classList.add('active');
  });
  render();
}

function render(){
  if(currentList.length===0){
    faceFront.innerHTML = '<div class="empty-state">ไม่พบคำศัพท์ที่ค้นหา</div>';
    faceBack.innerHTML = '';
    counterEl.innerHTML = '';
    metaLine.textContent = '';
    document.getElementById('prevBtn').disabled = true;
    document.getElementById('nextBtn').disabled = true;
    return;
  }
  const v = vocab[currentList[currentIndex]];
  const c = catInfo(v.cat);
  document.documentElement.style.setProperty('--accent', c.color);
  cardEl.style.setProperty('--accent', c.color);
  cardEl.style.setProperty('--accent-light', c.light);

  faceFront.innerHTML = `
    <div class="cat-chip">${c.name}</div>
    <div class="word-front">${v.w}</div>
    <div class="pos">${v.pos}</div>
    <div class="flip-hint">แตะการ์ดเพื่อดูความหมาย และตัวอย่างประโยค</div>
  `;
  faceBack.innerHTML = `
    <div class="cat-chip">${c.name}</div>
    <div class="word-back">${v.w} <span style="font-size:13px;color:var(--ink-soft);font-weight:400;font-style:italic;">${v.pos}</span></div>
    <div class="en-def"><span class="en-def-label">EN</span>${v.en}</div>
    <div class="th-meaning"><span class="th-meaning-label">TH</span>${v.th}</div>
    <div class="usage"><b>วิธีใช้:</b> ${v.use}</div>
    <div class="ex-label">ตัวอย่างประโยค (ง่าย → ซับซ้อน)</div>
    <ul class="ex-list">
      ${v.ex.map((s,i)=>`<li data-n="${i+1}">${s}</li>`).join('')}
    </ul>
  `;
  counterEl.innerHTML = `การ์ดที่ <b>${currentIndex+1}</b> จาก <b>${currentList.length}</b>`;
  metaLine.textContent = `รวมทั้งหมด ${vocab.length} คำ · 6 หมวดหมู่`;
  document.getElementById('prevBtn').disabled = currentIndex===0;
  document.getElementById('nextBtn').disabled = currentIndex===currentList.length-1;
}

cardEl.addEventListener('click', ()=>{
  if(currentList.length===0) return;
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
});

document.getElementById('prevBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  if(currentIndex>0){ currentIndex--; flipped=false; cardEl.classList.remove('flipped'); render(); }
});
document.getElementById('nextBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  if(currentIndex<currentList.length-1){ currentIndex++; flipped=false; cardEl.classList.remove('flipped'); render(); }
});
document.getElementById('shuffleBtn').addEventListener('click', ()=>{
  for(let i=currentList.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [currentList[i],currentList[j]] = [currentList[j],currentList[i]];
  }
  currentIndex = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  render();
});
searchInput.addEventListener('input', applyFilter);

document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') document.getElementById('nextBtn').click();
  if(e.key==='ArrowLeft') document.getElementById('prevBtn').click();
  if(e.key===' '){ e.preventDefault(); cardEl.click(); }
});

buildTabs();
applyFilter();
</script>
