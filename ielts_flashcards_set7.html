<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Advanced Vocabulary — คำศัพท์เตรียมสอบ IELTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC;
    --paper-line:#E4DFD2;
    --ink:#2B2822;
    --ink-soft:#6B6558;
    --card-bg:#FFFDF8;
    --shadow:rgba(43,40,34,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans Thai','Inter',sans-serif;
    background:
      repeating-linear-gradient(180deg, transparent, transparent 35px, var(--paper-line) 36px),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  /* Header */
  header{margin-bottom:22px;}
  .title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(26px,5vw,34px);
    margin:0;
    letter-spacing:-0.01em;
  }
  .set-badge{
    font-size:11.5px;font-weight:700;color:#fff;background:var(--ink);
    padding:4px 10px;border-radius:20px;letter-spacing:.02em;
    transform:translateY(-2px);
  }
  .title-th{font-family:'Noto Serif Thai',serif;font-size:16px;color:var(--ink-soft);margin:4px 0 0;}
  .meta-line{font-size:13px;color:var(--ink-soft);margin-top:10px;}

  /* Search */
  .search-box{margin:18px 0 14px;position:relative;}
  .search-box input{
    width:100%;
    padding:11px 14px 11px 38px;
    border-radius:10px;
    border:1.5px solid var(--paper-line);
    background:var(--card-bg);
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  .search-box input:focus{border-color:var(--ink-soft);}
  .search-box::before{
    content:"🔍";
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    font-size:14px;opacity:.55;
  }

  /* Category tabs styled like binder index tabs */
  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:20px;
    scrollbar-width:thin;
  }
  .tab{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:8px 8px 0 0;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    border:none;
    color:#fff;
    opacity:.55;
    transition:opacity .15s ease, transform .12s ease;
    white-space:nowrap;
  }
  .tab:hover{opacity:.8;}
  .tab.active{opacity:1;transform:translateY(-2px);}

  /* Flashcard */
  .card-stage{
    perspective:1400px;
    margin-bottom:16px;
  }
  .card{
    position:relative;
    width:100%;
    min-height:340px;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    border-radius:16px;
    background:var(--card-bg);
    box-shadow:0 10px 30px var(--shadow), 0 1px 0 rgba(255,255,255,.6) inset;
    border-left:7px solid var(--accent, #6A4C93);
    padding:30px 28px;
    display:flex;
    flex-direction:column;
  }
  .face-back{transform:rotateY(180deg);overflow-y:auto;}

  .cat-chip{
    align-self:flex-start;
    font-size:11.5px;
    font-weight:700;
    color:var(--accent, #6A4C93);
    background:var(--accent-light, #EFE7F5);
    padding:3px 10px;
    border-radius:20px;
    margin-bottom:16px;
    letter-spacing:.02em;
  }
  .word-front{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(32px,7vw,44px);
    line-height:1.1;
    margin:0 0 8px;
  }
  .pos{font-size:14px;color:var(--ink-soft);font-style:italic;margin-bottom:auto;}
  .flip-hint{
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed var(--paper-line);
  }

  .word-back{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin:0 0 4px;
  }
  .en-def{
    font-size:14px;
    color:var(--ink);
    margin:0 0 10px;
    line-height:1.6;
    padding-left:1px;
  }
  .en-def-label{
    font-size:10.5px;font-weight:700;letter-spacing:.04em;
    color:var(--accent,#6A4C93);margin-right:6px;
  }
  .th-meaning{
    font-family:'Noto Serif Thai',serif;
    font-size:16px;
    color:var(--ink);
    margin:0 0 14px;
    line-height:1.55;
  }
  .th-meaning-label{
    font-size:10.5px;font-weight:700;letter-spacing:.04em;
    font-family:'Noto Sans Thai',sans-serif;
    color:var(--accent,#6A4C93);margin-right:6px;
  }
  .usage{
    font-size:13.5px;
    color:var(--ink-soft);
    background:var(--paper);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:16px;
    line-height:1.6;
  }
  .usage b{color:var(--ink);}
  .ex-label{font-size:12px;font-weight:700;color:var(--accent,#6A4C93);letter-spacing:.03em;margin-bottom:8px;}
  .ex-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .ex-list li{
    font-size:14px;
    line-height:1.55;
    padding-left:22px;
    position:relative;
  }
  .ex-list li::before{
    content:attr(data-n);
    position:absolute;left:0;top:1px;
    font-size:11px;font-weight:700;
    color:#fff;background:var(--accent,#6A4C93);
    width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .ex-list mark{
    background:var(--accent-light,#EFE7F5);
    color:var(--accent,#6A4C93);
    padding:0 3px;
    border-radius:3px;
    font-weight:600;
  }

  /* Controls */
  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:18px;
  }
  .nav-btn{
    background:var(--card-bg);
    border:1.5px solid var(--paper-line);
    border-radius:10px;
    width:44px;height:44px;
    font-size:18px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease;
    flex:0 0 auto;
  }
  .nav-btn:hover{background:var(--paper);}
  .nav-btn:disabled{opacity:.35;cursor:default;}
  .counter{
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    flex:1;
  }
  .counter b{color:var(--ink);}
  .shuffle-btn{
    background:var(--card-bg);
    border:1.5px solid var(--paper-line);
    border-radius:10px;
    padding:0 16px;height:44px;
    font-size:13px;font-weight:600;
    font-family:inherit;
    cursor:pointer;
    color:var(--ink);
    display:flex;align-items:center;gap:6px;
    flex:0 0 auto;
  }
  .shuffle-btn:hover{background:var(--paper);}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:14px;
  }

  @media (max-width:480px){
    .face{padding:24px 20px;}
    .controls{flex-wrap:wrap;}
    .counter{order:3;width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-row">
      <h1>IELTS Advanced Vocabulary</h1>
      <span class="set-badge">ชุดที่ 7</span>
    </div>
    <p class="title-th">คำศัพท์ขั้นสูง 150 คำ แบ่งตามหัวข้อ พร้อมคำจำกัดความภาษาอังกฤษ ความหมายไทย วิธีใช้ และตัวอย่างประโยค 3 ระดับ</p>
    <p class="meta-line" id="metaLine"></p>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="ค้นหาคำศัพท์ หรือ พิมพ์คำแปลไทย...">
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="card-stage">
    <div class="card" id="card">
      <div class="face face-front" id="faceFront"></div>
      <div class="face face-back" id="faceBack"></div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" title="คำก่อนหน้า">←</button>
    <div class="counter" id="counter"></div>
    <button class="nav-btn" id="nextBtn" title="คำถัดไป">→</button>
  </div>
  <div class="controls" style="margin-top:10px;justify-content:center;">
    <button class="shuffle-btn" id="shuffleBtn">🔀 สุ่มลำดับ</button>
  </div>
</div>

<script>
const categories = [
  {id:'marine', name:'ชีววิทยาทางทะเล-นิเวศวิทยา', color:'#1D6E7A', light:'#DCEBEC'},
  {id:'architecture', name:'สถาปัตยกรรม-การออกแบบ', color:'#6E6250', light:'#E9E4DB'},
  {id:'childhood', name:'พัฒนาการเด็ก-การเลี้ยงดู', color:'#D4845E', light:'#F5E2D6'},
  {id:'aging', name:'ผู้สูงวัย-การดูแลผู้สูงอายุ', color:'#5C6B73', light:'#E2E6E8'},
  {id:'fashion', name:'แฟชั่น-อุตสาหกรรมสิ่งทอ', color:'#B23E76', light:'#F2DCE7'},
  {id:'sportsmed', name:'เวชศาสตร์การกีฬา-การบาดเจ็บ', color:'#C4562E', light:'#F5E0D6'},
];

const vocab = [

// ============ MARINE BIOLOGY & ECOLOGY (25) ============
{cat:'marine',w:'marine',pos:'adj.',en:'relating to the sea or ocean',th:'ทางทะเล',use:'ใช้กับ life, ecosystem, biology',ex:['Marine life is diverse.','She studies marine biology.','Marine ecosystems face growing pressure from pollution and overfishing.']},
{cat:'marine',w:'coral reef',pos:'phrase',en:'an underwater structure formed by colonies of coral, home to diverse marine life',th:'แนวปะการัง',use:'ใช้กับ protect, bleach',ex:['The coral reef attracts divers.','Pollution damaged the coral reef.','Coral reefs support an estimated quarter of all marine species.']},
{cat:'marine',w:'species',pos:'n.',en:'a group of organisms capable of interbreeding, sharing common characteristics',th:'สปีชีส์/ชนิดพันธุ์',use:'ใช้กับ endangered, discover',ex:['Scientists discovered a new species.','The species is now endangered.','Several marine species have adapted to survive in extremely deep water.']},
{cat:'marine',w:'predator',pos:'n.',en:'an animal that hunts and kills other animals for food',th:'ผู้ล่า',use:'ใช้กับ top, natural',ex:['The shark is a top predator.','Predators keep populations balanced.','Removing a key predator can seriously disrupt an entire ecosystem.']},
{cat:'marine',w:'prey',pos:'n.',en:'an animal hunted or killed by another for food',th:'เหยื่อ',use:'ใช้กับ hunt, become',ex:['The lion hunts its prey.','Small fish often become prey.','Camouflage helps prey avoid being detected by nearby predators.']},
{cat:'marine',w:'food chain',pos:'phrase',en:'a sequence of organisms, each dependent on the next as a source of food',th:'ห่วงโซ่อาหาร',use:'ใช้กับ disrupt, top of',ex:['Sharks sit atop the food chain.','Pollution disrupts the food chain.','Removing one species can cause the entire food chain to collapse.']},
{cat:'marine',w:'food web',pos:'phrase',en:'a complex network of interconnected food chains within an ecosystem',th:'ใยอาหาร',use:'ใช้กับ complex, study',ex:['Scientists study the ocean’s food web.','The food web is highly complex.','A healthy food web depends on maintaining balance across many species.']},
{cat:'marine',w:'plankton',pos:'n.',en:'tiny organisms that drift in water, forming the base of most aquatic food chains',th:'แพลงก์ตอน',use:'ใช้กับ feed on, bloom',ex:['Whales feed on plankton.','Plankton blooms color the water.','Plankton forms the essential foundation of nearly every marine food chain.']},
{cat:'marine',w:'coastal',pos:'adj.',en:'relating to or located near the coast',th:'ชายฝั่ง',use:'ใช้กับ area, erosion',ex:['Coastal areas face erosion.','She lives in a coastal town.','Rising sea levels increasingly threaten coastal communities around the world.']},
{cat:'marine',w:'aquatic',pos:'adj.',en:'living or growing in water',th:'ในน้ำ/เกี่ยวกับน้ำ',use:'ใช้กับ life, plant',ex:['Aquatic life thrives in the lake.','Aquatic plants purify water.','The aquarium houses a wide variety of aquatic species.']},
{cat:'marine',w:'marine life',pos:'phrase',en:'organisms that live in the sea, including fish, plants, and other creatures',th:'สิ่งมีชีวิตในทะเล',use:'ใช้กับ diverse, protect',ex:['The reef supports diverse marine life.','Plastic pollution harms marine life.','Protecting marine life requires international cooperation across many countries.']},
{cat:'marine',w:'overfishing',pos:'n.',en:'the practice of catching fish faster than populations can replenish themselves',th:'การจับปลาเกินขนาด',use:'ใช้กับ cause, prevent',ex:['Overfishing depleted local stocks.','Regulations aim to prevent overfishing.','Overfishing has pushed several commercial fish populations toward collapse.']},
{cat:'marine',w:'bycatch',pos:'n.',en:'unwanted marine animals accidentally caught while fishing for a different species',th:'สัตว์น้ำที่ติดมาโดยไม่ตั้งใจจากการจับปลา',use:'ใช้กับ reduce, discard',ex:['Bycatch is often discarded.','New nets reduce bycatch.','Reducing bycatch has become a major goal of sustainable fishing practices.']},
{cat:'marine',w:'coral bleaching',pos:'phrase',en:'the whitening of coral caused by stress, often from rising ocean temperatures',th:'ปะการังฟอกขาว',use:'ใช้กับ cause, widespread',ex:['Warming oceans cause coral bleaching.','Widespread coral bleaching alarmed scientists.','Repeated coral bleaching events have devastated reef systems worldwide.']},
{cat:'marine',w:'invasive species',pos:'phrase',en:'a non-native organism that spreads rapidly and harms its new environment',th:'สิ่งมีชีวิตต่างถิ่นรุกราน',use:'ใช้กับ introduce, threaten',ex:['The invasive species harmed local fish.','Ships accidentally introduced invasive species.','Invasive species can threaten native wildlife that has no natural defenses against them.']},
{cat:'marine',w:'symbiosis',pos:'n.',en:'a close, long-term relationship between two different species, often mutually beneficial',th:'ภาวะพึ่งพาอาศัยกัน',use:'ใช้กับ mutual, example of',ex:['Clownfish live in symbiosis with anemones.','It’s a classic example of symbiosis.','Symbiosis allows both species involved to benefit from the close relationship.']},
{cat:'marine',w:'migratory',pos:'adj.',en:'regularly moving from one region to another, especially seasonally',th:'ที่อพยพย้ายถิ่นตามฤดูกาล',use:'ใช้กับ species, pattern',ex:['Whales are migratory animals.','Scientists track migratory patterns.','Migratory species often travel thousands of kilometers between breeding grounds.']},
{cat:'marine',w:'spawning',pos:'n.',en:'the process by which fish or other aquatic animals release eggs to reproduce',th:'การวางไข่ (ปลา/สัตว์น้ำ)',use:'ใช้กับ season, site',ex:['Salmon return to spawn upstream.','The spawning season begins in spring.','Protecting spawning sites is essential for maintaining healthy fish populations.']},
{cat:'marine',w:'marine sanctuary',pos:'phrase',en:'a protected area of ocean where marine life is safeguarded from harmful human activity',th:'เขตอนุรักษ์ทางทะเล',use:'ใช้กับ establish, protect',ex:['They established a marine sanctuary.','The sanctuary protects endangered species.','Marine sanctuaries allow damaged ecosystems the chance to slowly recover.']},
{cat:'marine',w:'ocean acidification',pos:'phrase',en:'the ongoing decrease in ocean pH caused by absorption of excess carbon dioxide',th:'ภาวะกรดในมหาสมุทร',use:'ใช้กับ cause, threaten',ex:['Ocean acidification harms shellfish.','Scientists study ocean acidification.','Ocean acidification threatens organisms that rely on calcium carbonate to build their shells.']},
{cat:'marine',w:'deep sea',pos:'phrase',en:'the lowest layer of the ocean, characterized by darkness and extreme pressure',th:'ทะเลลึก',use:'ใช้กับ explore, creature',ex:['Deep sea creatures fascinate scientists.','They explored the deep sea.','Much of the deep sea remains completely unexplored by scientists.']},
{cat:'marine',w:'tidal',pos:'adj.',en:'relating to the regular rise and fall of the sea’s surface caused by the moon’s gravity',th:'เกี่ยวกับกระแสน้ำขึ้นลง',use:'ใช้กับ pool, energy',ex:['Children explore tidal pools.','The plant generates tidal energy.','Tidal pools provide a unique habitat for many small coastal creatures.']},
{cat:'marine',w:'estuary',pos:'n.',en:'the area where a river meets the sea, mixing fresh and salt water',th:'ปากแม่น้ำ (บริเวณน้ำจืดผสมน้ำเค็ม)',use:'ใช้กับ protect, rich in',ex:['The estuary supports many species.','They worked to protect the estuary.','Estuaries are rich, biologically productive habitats for countless young fish.']},
{cat:'marine',w:'keystone species',pos:'phrase',en:'a species that has a disproportionately large effect on its ecosystem relative to its abundance',th:'สิ่งมีชีวิตแกนหลักของระบบนิเวศ',use:'ใช้กับ identify, protect',ex:['Sea otters are a keystone species.','Protecting keystone species helps whole ecosystems.','Removing a single keystone species can trigger the collapse of an entire ecosystem.']},
{cat:'marine',w:'bioluminescence',pos:'n.',en:'the production of light by living organisms, especially seen in deep-sea creatures',th:'การเรืองแสงทางชีวภาพ',use:'ใช้กับ produce, observe',ex:['Some fish produce bioluminescence.','Divers observed rare bioluminescence.','Many deep-sea creatures rely on bioluminescence to attract prey or mates in the dark.']},

// ============ ARCHITECTURE & DESIGN (25) ============
{cat:'architecture',w:'blueprint',pos:'n.',en:'a detailed technical drawing or plan for a building or structure',th:'พิมพ์เขียว (แบบก่อสร้าง)',use:'ใช้กับ draw up, follow',ex:['The architect drew up a blueprint.','Builders followed the blueprint exactly.','Every construction project begins with a carefully detailed blueprint.']},
{cat:'architecture',w:'facade',pos:'n.',en:'the front exterior of a building, especially its main face',th:'ด้านหน้าอาคาร',use:'ใช้กับ restore, ornate',ex:['They restored the building’s facade.','The facade features ornate carvings.','The historic facade was carefully preserved during the recent renovation.']},
{cat:'architecture',w:'load-bearing',pos:'adj.',en:'(of a wall or structure) designed to support the weight of a building',th:'รับน้ำหนัก (โครงสร้าง)',use:'ใช้กับ wall, remove',ex:['That is a load-bearing wall.','They cannot remove a load-bearing wall.','Removing a load-bearing wall without proper support can cause the structure to collapse.']},
{cat:'architecture',w:'architect',pos:'n.',en:'a person who designs buildings and oversees their construction',th:'สถาปนิก',use:'ใช้กับ hire, renowned',ex:['They hired an architect.','The renowned architect designed the museum.','The architect balanced aesthetic beauty with practical structural requirements.']},
{cat:'architecture',w:'green building',pos:'phrase',en:'a building designed to reduce environmental impact through efficient use of resources',th:'อาคารสีเขียว (เป็นมิตรกับสิ่งแวดล้อม)',use:'ใช้กับ design, certify',ex:['They designed a green building.','The office achieved green building certification.','Green buildings often use solar panels and efficient insulation to reduce energy use.']},
{cat:'architecture',w:'floor plan',pos:'phrase',en:'a scale diagram showing the layout of rooms in a building from above',th:'ผังพื้น',use:'ใช้กับ design, review',ex:['They reviewed the floor plan.','The floor plan includes three bedrooms.','A well-designed floor plan maximizes natural light and usable space.']},
{cat:'architecture',w:'ornamentation',pos:'n.',en:'decorative details added to a building or object',th:'ลวดลายประดับตกแต่ง',use:'ใช้กับ elaborate, remove',ex:['The building has elaborate ornamentation.','Modern design removes unnecessary ornamentation.','Victorian architecture is known for its highly detailed ornamentation.']},
{cat:'architecture',w:'geometric',pos:'adj.',en:'based on simple shapes and regular patterns, such as lines and angles',th:'เชิงเรขาคณิต',use:'ใช้กับ pattern, design',ex:['The building has geometric patterns.','She prefers geometric design.','The facade features bold geometric shapes arranged in a repeating pattern.']},
{cat:'architecture',w:'symmetry',pos:'n.',en:'a balanced arrangement in which both sides mirror each other',th:'ความสมมาตร',use:'ใช้กับ create, perfect',ex:['The design has perfect symmetry.','Architects value symmetry.','Classical buildings often rely heavily on symmetry to appear balanced and grand.']},
{cat:'architecture',w:'asymmetrical',pos:'adj.',en:'lacking symmetry; unequal on either side',th:'ไม่สมมาตร',use:'ตรงข้ามกับ symmetrical',ex:['The house has an asymmetrical design.','Modern buildings often look asymmetrical.','The asymmetrical facade gives the building a striking, unconventional appearance.']},
{cat:'architecture',w:'cantilever',pos:'n.',en:'a long structural element extending horizontally, supported only at one end',th:'โครงสร้างยื่น',use:'ใช้กับ design, extend',ex:['The balcony uses a cantilever design.','The roof cantilevers over the entrance.','Engineers used a dramatic cantilever to extend the building far beyond its base.']},
{cat:'architecture',w:'foundation',pos:'n.',en:'the lower part of a structure that transfers its weight to the ground',th:'ฐานราก',use:'ใช้กับ lay, strong',ex:['Workers laid the foundation.','A strong foundation is essential.','Engineers inspected the foundation before construction could safely continue.']},

let currentIndex = 0;
let currentList = vocab.map((v,i)=>i);
let activeCat = 'all';
let flipped = false;

const tabsEl = document.getElementById('tabs');
const cardEl = document.getElementById('card');
const faceFront = document.getElementById('faceFront');
const faceBack = document.getElementById('faceBack');
const counterEl = document.getElementById('counter');
const metaLine = document.getElementById('metaLine');
const searchInput = document.getElementById('searchInput');

function catInfo(id){ return categories.find(c=>c.id===id); }

function buildTabs(){
  const all = document.createElement('button');
  all.className = 'tab' + (activeCat==='all' ? ' active':'');
  all.textContent = `ทั้งหมด (${vocab.length})`;
  all.style.background = '#8A8577';
  all.onclick = ()=>{ activeCat='all'; applyFilter(); };
  tabsEl.appendChild(all);
  categories.forEach(c=>{
    const count = vocab.filter(v=>v.cat===c.id).length;
    const btn = document.createElement('button');
    btn.className = 'tab' + (activeCat===c.id ? ' active':'');
    btn.textContent = `${c.name} (${count})`;
    btn.style.background = c.color;
    btn.onclick = ()=>{ activeCat=c.id; applyFilter(); };
    tabsEl.appendChild(btn);
  });
}

function applyFilter(){
  const q = searchInput.value.trim().toLowerCase();
  currentList = vocab
    .map((v,i)=>i)
    .filter(i=>{
      const v = vocab[i];
      const matchCat = activeCat==='all' || v.cat===activeCat;
      const matchSearch = !q || v.w.toLowerCase().includes(q) || v.th.includes(q);
      return matchCat && matchSearch;
    });
  currentIndex = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  Array.from(tabsEl.children).forEach((el,idx)=>{
    el.classList.remove('active');
  });
  Array.from(tabsEl.children).forEach((el)=>{
    const isAll = el.textContent.startsWith('ทั้งหมด');
    if(activeCat==='all' && isAll) el.classList.add('active');
  });
  categories.forEach((c,idx)=>{
    const el = tabsEl.children[idx+1];
    if(activeCat===c.id) el.classList.add('active');
  });
  render();
}

function render(){
  if(currentList.length===0){
    faceFront.innerHTML = '<div class="empty-state">ไม่พบคำศัพท์ที่ค้นหา</div>';
    faceBack.innerHTML = '';
    counterEl.innerHTML = '';
    metaLine.textContent = '';
    document.getElementById('prevBtn').disabled = true;
    document.getElementById('nextBtn').disabled = true;
    return;
  }
  const v = vocab[currentList[currentIndex]];
  const c = catInfo(v.cat);
  document.documentElement.style.setProperty('--accent', c.color);
  cardEl.style.setProperty('--accent', c.color);
  cardEl.style.setProperty('--accent-light', c.light);

  faceFront.innerHTML = `
    <div class="cat-chip">${c.name}</div>
    <div class="word-front">${v.w}</div>
    <div class="pos">${v.pos}</div>
    <div class="flip-hint">แตะการ์ดเพื่อดูความหมาย และตัวอย่างประโยค</div>
  `;
  faceBack.innerHTML = `
    <div class="cat-chip">${c.name}</div>
    <div class="word-back">${v.w} <span style="font-size:13px;color:var(--ink-soft);font-weight:400;font-style:italic;">${v.pos}</span></div>
    <div class="en-def"><span class="en-def-label">EN</span>${v.en}</div>
    <div class="th-meaning"><span class="th-meaning-label">TH</span>${v.th}</div>
    <div class="usage"><b>วิธีใช้:</b> ${v.use}</div>
    <div class="ex-label">ตัวอย่างประโยค (ง่าย → ซับซ้อน)</div>
    <ul class="ex-list">
      ${v.ex.map((s,i)=>`<li data-n="${i+1}">${s}</li>`).join('')}
    </ul>
  `;
  counterEl.innerHTML = `การ์ดที่ <b>${currentIndex+1}</b> จาก <b>${currentList.length}</b>`;
  metaLine.textContent = `รวมทั้งหมด ${vocab.length} คำ · 6 หมวดหมู่`;
  document.getElementById('prevBtn').disabled = currentIndex===0;
  document.getElementById('nextBtn').disabled = currentIndex===currentList.length-1;
}

cardEl.addEventListener('click', ()=>{
  if(currentList.length===0) return;
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
});

document.getElementById('prevBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  if(currentIndex>0){ currentIndex--; flipped=false; cardEl.classList.remove('flipped'); render(); }
});
document.getElementById('nextBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  if(currentIndex<currentList.length-1){ currentIndex++; flipped=false; cardEl.classList.remove('flipped'); render(); }
});
document.getElementById('shuffleBtn').addEventListener('click', ()=>{
  for(let i=currentList.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [currentList[i],currentList[j]] = [currentList[j],currentList[i]];
  }
  currentIndex = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  render();
});
searchInput.addEventListener('input', applyFilter);

document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') document.getElementById('nextBtn').click();
  if(e.key==='ArrowLeft') document.getElementById('prevBtn').click();
  if(e.key===' '){ e.preventDefault(); cardEl.click(); }
});

buildTabs();
applyFilter();
</script>
